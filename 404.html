<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Prithvi Realcon</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#0f2142;--ink2:#506078;--a:#1d4ed8;--b:#3b82f6;--gold:#d9ac4e}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 15% 10%,#bcd2ff66,transparent 60%),radial-gradient(800px 500px at 90% 90%,#fde7bd88,transparent 60%),#f4f7fc;overflow:hidden}
h1{font:800 clamp(6rem,26vw,13rem)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.05em;background:linear-gradient(135deg,var(--ink),var(--a) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
p{color:var(--ink2);margin:.4rem 0 1.8rem;font-size:1.08rem;animation:rise .8s .12s cubic-bezier(.16,1,.3,1) both}
a{display:inline-flex;gap:.6rem;align-items:center;padding:.9rem 1.5rem;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-decoration:none;font-weight:600;box-shadow:0 14px 26px -14px var(--a);transition:transform .3s;animation:rise .8s .22s cubic-bezier(.16,1,.3,1) both}
a:hover{transform:translateY(-3px)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>This page does not exist or has moved.</p>
  <a id="home" href="index.html">&larr; Back to Prithvi Realcon</a>
</main>
<script>
  /* works for both user.github.io/REPO/ and a custom domain */
  (function(){
    var seg = location.pathname.split('/')[1], base = '/';
    if (/github\.io$/.test(location.hostname) && seg) base = '/' + seg + '/';
    document.getElementById('home').href = base + 'index.html';
    var i = document.querySelector('link[rel=icon]'); if (i) i.href = base + 'assets/favicon.svg';
  })();
</script>
</body>
</html>
