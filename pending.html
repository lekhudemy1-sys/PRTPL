/* ==========================================================
   Prithvi Realcon – shared UI layer (prtpl.css)
   Preloader · page transitions · toasts · command palette ·
   colour themes · dark mode · scroll progress · back-to-top
   ========================================================== */

:root{
  --pr-a:#1d4ed8; --pr-b:#3b82f6; --pr-deep:#0f2142; --pr-gold:#d9ac4e;
  --pr-o1:#bcd2ff; --pr-o2:#c3f1e1; --pr-o3:#fde7bd;
  --pr-ease:cubic-bezier(.16,1,.3,1);
}

/* ---------- Colour templates ---------- */
html[data-theme="emerald"]{--pr-a:#0f8a6a;--pr-b:#22c55e;--pr-deep:#073b2e;--pr-gold:#e0b050;--pr-o1:#b6efd9;--pr-o2:#cfe8ff;--pr-o3:#fdf0c4}
html[data-theme="violet"]{--pr-a:#6d28d9;--pr-b:#a78bfa;--pr-deep:#24124d;--pr-gold:#f0b429;--pr-o1:#ddd0ff;--pr-o2:#c9e8ff;--pr-o3:#ffd9e8}
html[data-theme="sunset"]{--pr-a:#c2410c;--pr-b:#f59e0b;--pr-deep:#3b1606;--pr-gold:#f7c948;--pr-o1:#ffd6b8;--pr-o2:#ffe9a8;--pr-o3:#ffc9d6}
html[data-theme="rose"]{--pr-a:#be185d;--pr-b:#f472b6;--pr-deep:#3d0a24;--pr-gold:#f3b95f;--pr-o1:#ffd0e3;--pr-o2:#ffe0c2;--pr-o3:#e6d5ff}
html[data-theme="teal"]{--pr-a:#0e7490;--pr-b:#22d3ee;--pr-deep:#073642;--pr-gold:#e6b450;--pr-o1:#b8ecf7;--pr-o2:#c3f1e1;--pr-o3:#fdeabd}

/* Theme-aware surfaces (hub pages only: index, home, AMM, ODR, notices, 404) */
html[data-hub] .orb.o1,html[data-hub] .blob.b1{background:var(--pr-o1)}
html[data-hub] .orb.o2,html[data-hub] .blob.b2{background:var(--pr-o2)}
html[data-hub] .orb.o3,html[data-hub] .blob.b3{background:var(--pr-o3)}
html[data-hub] .mark{background:linear-gradient(140deg,var(--pr-deep),var(--pr-a))!important}
html[data-hub="grid"] .head{background-image:linear-gradient(180deg,var(--ink) 30%,var(--pr-a) 150%)}
html[data-hub] .site-footer{background:linear-gradient(135deg,var(--pr-deep) 0%,color-mix(in srgb,var(--pr-a) 70%,var(--pr-deep)) 60%,var(--pr-a) 125%)!important}
html[data-hub] .go[type=submit],html[data-hub] button.go{background:linear-gradient(135deg,var(--pr-a),var(--pr-b))}
html[data-hub] .type::after{background:var(--pr-gold)}
html[data-hub] .cursor-glow{background:radial-gradient(circle,color-mix(in srgb,var(--pr-a) 14%,transparent),transparent 65%)}
html[data-hub] input:focus{border-color:var(--pr-b);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr-b) 20%,transparent)}
html[data-hub] a:focus-visible,html[data-hub] button:focus-visible{outline-color:var(--pr-a)}
html[data-hub] .check input:checked+.box{background:var(--pr-a);border-color:var(--pr-a)}

/* ---------- Dark mode (hub pages) ---------- */
html[data-mode="dark"]{color-scheme:dark;--pr-o1:#1b3270;--pr-o2:#0f4a3b;--pr-o3:#4a3410}
html[data-mode="dark"][data-hub]{
  --bg:#0a1020;--surface:#111a2e;--ink:#e8eefc;--ink2:#a9b6d0;--mute:#7886a3;--line:#22304d;
}
html[data-mode="dark"][data-hub] body{background:linear-gradient(180deg,#0a1020 0%,#0b1325 60%,#09101f 100%)!important}
html[data-mode="dark"][data-hub] .orb,html[data-mode="dark"][data-hub] .blob{opacity:.38}
html[data-mode="dark"][data-hub] .grain{opacity:.06}
html[data-mode="dark"][data-hub] .top{background:rgba(17,26,46,.78)}
html[data-mode="dark"][data-hub] .back,html[data-mode="dark"][data-hub] .eye:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
html[data-mode="dark"][data-hub] .tile,html[data-mode="dark"][data-hub] .note,html[data-mode="dark"][data-hub] .card{background:rgba(17,26,46,.88)!important;border-color:var(--line)}
html[data-mode="dark"][data-hub] .tile:hover{border-color:color-mix(in srgb,var(--c) 70%,#000)}
html[data-mode="dark"][data-hub] .ico{background:color-mix(in srgb,var(--c,var(--pr-a)) 20%,#111a2e)!important;border-color:color-mix(in srgb,var(--c,var(--pr-a)) 35%,#111a2e)!important}
html[data-mode="dark"][data-hub] .ico img{background:#fff;border-radius:10px;padding:4px}
html[data-mode="dark"][data-hub] .go{background:#18233d;border-color:var(--line)}
html[data-mode="dark"][data-hub] .inspire{background:linear-gradient(120deg,#2a2210,#241d0e 60%,#2b2311);border-color:#4d3d17}
html[data-mode="dark"][data-hub] .inspire-title{color:#f1d9a0}
html[data-mode="dark"][data-hub] .inspire-title em{color:var(--pr-gold)}
html[data-mode="dark"][data-hub] input{background:#0d1528;border-color:var(--line);color:var(--ink)}
html[data-mode="dark"][data-hub] input:focus{background:#0f1a33}
html[data-mode="dark"][data-hub] .box{background:#0d1528;border-color:#33466b}
html[data-mode="dark"][data-hub] .btn{background:var(--pr-a);color:#fff}
html[data-mode="dark"][data-hub] .note .tag,html[data-mode="dark"][data-hub] .note .ico{background:color-mix(in srgb,var(--c) 22%,#111a2e);color:color-mix(in srgb,var(--c) 55%,#fff)}
html[data-mode="dark"][data-hub] .card::before{opacity:.5}

/* ---------- Preloader ---------- */
html.pr-loading{overflow:hidden}
#pr-loader{
  position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 50% 38%,#ffffff 0%,#f1f6ff 55%,#e6eefb 100%);
  transition:opacity .55s var(--pr-ease),visibility .55s,transform .7s var(--pr-ease);
}
html[data-mode="dark"] #pr-loader{background:radial-gradient(1200px 700px at 50% 38%,#14203b 0%,#0b1325 60%,#070c18 100%)}
#pr-loader.out{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
.pr-stage{display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center;padding:1.5rem}
.pr-anim{position:relative;width:min(240px,56vw);aspect-ratio:1;display:grid;place-items:center}
.pr-anim>*{grid-area:1/1}
.pr-anim svg,.pr-anim dotlottie-player,.pr-anim canvas{width:100%!important;height:100%!important}
.pr-fallback{display:grid;place-items:center;transition:opacity .4s}
.pr-fallback.hide{opacity:0}
.pr-ring{width:150px;height:150px;border-radius:50%;border:4px solid color-mix(in srgb,var(--pr-a) 18%,transparent);border-top-color:var(--pr-a);border-right-color:var(--pr-b);animation:pr-rot 1s linear infinite;position:relative}
.pr-fallback .pr-mk svg{width:38px;height:38px;fill:#fff}
.pr-fallback .pr-mk{position:absolute;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:1.35rem;
  background:linear-gradient(140deg,var(--pr-deep),var(--pr-a));box-shadow:0 14px 26px -12px color-mix(in srgb,var(--pr-a) 80%,transparent);animation:pr-bob 1.6s ease-in-out infinite}
.pr-name{font:700 1.1rem/1.2 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--pr-deep)}
html[data-mode="dark"] .pr-name{color:#e8eefc}
.pr-bar{width:min(220px,60vw);height:4px;border-radius:99px;background:color-mix(in srgb,var(--pr-a) 15%,transparent);overflow:hidden}
.pr-bar i{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--pr-a),var(--pr-b),var(--pr-gold));animation:pr-slide 1.25s var(--pr-ease) infinite}
@keyframes pr-rot{to{transform:rotate(360deg)}}
@keyframes pr-bob{50%{transform:translateY(-5px) scale(1.04)}}
@keyframes pr-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

/* ---------- Page transitions ---------- */
html.pr-leave body{opacity:0;filter:blur(5px);transform:translateY(-6px);transition:opacity .24s ease,filter .24s ease,transform .24s ease}
body{animation:pr-in .6s var(--pr-ease) both}
@keyframes pr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Scroll progress ---------- */
#pr-progress{position:fixed;left:0;top:0;height:3px;width:0;z-index:2147482000;background:linear-gradient(90deg,var(--pr-a),var(--pr-b),var(--pr-gold));
  box-shadow:0 0 10px color-mix(in srgb,var(--pr-b) 60%,transparent);pointer-events:none;transition:width .1s linear,opacity .3s}

/* ---------- Floating controls ---------- */
.pr-fab{
  position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:2147481000;
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;display:grid;place-items:center;
  color:#fff;font-size:1rem;background:linear-gradient(135deg,var(--pr-a),var(--pr-b));
  box-shadow:0 14px 28px -12px color-mix(in srgb,var(--pr-a) 85%,transparent);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .3s,transform .4s var(--pr-ease)
}
.pr-fab.show{opacity:1;transform:none;pointer-events:auto}
.pr-fab:hover{transform:translateY(-3px)}
.pr-fab:focus-visible{outline:3px solid var(--pr-gold);outline-offset:3px}

/* ---------- Header chips (palette + theme) ---------- */
.pr-chipbtn{
  display:inline-flex;align-items:center;gap:.5rem;height:36px;padding:0 .8rem;border-radius:999px;cursor:pointer;
  background:var(--surface,#fff);border:1px solid var(--line,#e1e7f1);color:var(--ink,#0f2142);font:500 .84rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  transition:transform .3s var(--pr-ease),border-color .2s,box-shadow .3s
}
.pr-chipbtn:hover{transform:translateY(-1px);border-color:var(--pr-b);box-shadow:0 8px 18px -12px var(--pr-a)}
.pr-chipbtn kbd{font:600 .68rem ui-monospace,monospace;padding:.1rem .35rem;border-radius:6px;background:color-mix(in srgb,var(--pr-a) 10%,transparent);color:var(--pr-a)}
.pr-chipbtn.icon{width:36px;padding:0;justify-content:center}
.pr-floatbar{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:2147481000;display:flex;gap:.5rem}
@media (max-width:560px){
  html[data-hub] .top{gap:.5rem;padding-left:.7rem}
  html[data-hub] .top .brand{white-space:nowrap;min-width:0;gap:.5rem}
  html[data-hub] .top .brand span:last-child{font-size:.88rem;overflow:hidden;text-overflow:ellipsis}
  html[data-hub] .top .back{white-space:nowrap;padding:.5rem .8rem}
  html[data-hub] .top-right{gap:.4rem;flex:none}
}
@media (max-width:700px){.pr-chipbtn kbd,.pr-chipbtn .t{display:none}.pr-chipbtn{width:36px;padding:0;justify-content:center}}

/* ---------- Theme popover ---------- */
#pr-theme{
  position:fixed;z-index:2147482500;width:260px;padding:1rem;border-radius:20px;background:var(--surface,#fff);color:var(--ink,#0f2142);
  border:1px solid var(--line,#e1e7f1);box-shadow:0 30px 60px -24px rgba(15,33,66,.5);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:all .3s var(--pr-ease)
}
#pr-theme.open{opacity:1;visibility:visible;transform:none}
#pr-theme h4{font:700 .95rem "Bricolage Grotesque",ui-sans-serif,sans-serif;margin-bottom:.7rem}
.pr-sw{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;margin-bottom:.9rem}
.pr-sw button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--g);box-shadow:0 6px 12px -6px var(--g);transition:transform .25s var(--pr-ease)}
.pr-sw button:hover{transform:scale(1.14)}
.pr-sw button[aria-pressed=true]{border-color:var(--ink,#0f2142);outline:2px solid var(--surface,#fff);outline-offset:-4px}
.pr-mode{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;background:color-mix(in srgb,var(--ink,#0f2142) 6%,transparent);padding:.25rem;border-radius:12px}
.pr-mode button{border:0;cursor:pointer;border-radius:9px;padding:.45rem .2rem;background:none;color:var(--ink2,#506078);font:600 .78rem "Instrument Sans",ui-sans-serif,sans-serif;transition:all .25s}
.pr-mode button[aria-pressed=true]{background:var(--surface,#fff);color:var(--pr-a);box-shadow:0 4px 10px -6px rgba(15,33,66,.4)}

/* ---------- Command palette ---------- */
#pr-pal{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:start center;padding:12vh 1rem 1rem;background:rgba(8,14,30,.5);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#pr-pal.open{opacity:1;visibility:visible}
.pr-box{width:min(620px,100%);border-radius:22px;background:var(--surface,#fff);color:var(--ink,#0f2142);border:1px solid var(--line,#e1e7f1);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;transform:translateY(-12px) scale(.98);transition:transform .35s var(--pr-ease)}
#pr-pal.open .pr-box{transform:none}
.pr-sbar{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line,#e1e7f1)}
.pr-sbar i{color:var(--pr-a)}
.pr-sbar input{flex:1;border:0;outline:0;background:none;color:inherit;font:500 1rem "Instrument Sans",ui-sans-serif,sans-serif;height:auto;padding:0;box-shadow:none}
.pr-sbar span{font:600 .7rem ui-monospace,monospace;color:var(--mute,#8794ab);border:1px solid var(--line,#e1e7f1);border-radius:6px;padding:.15rem .4rem}
.pr-list{max-height:52vh;overflow:auto;padding:.5rem;list-style:none;margin:0}
.pr-item{display:flex;align-items:center;gap:.85rem;padding:.7rem .8rem;border-radius:14px;cursor:pointer;font:500 .95rem "Instrument Sans",ui-sans-serif,sans-serif}
.pr-item .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--c,var(--pr-a));background:color-mix(in srgb,var(--c,var(--pr-a)) 13%,transparent)}
.pr-item small{display:block;color:var(--mute,#8794ab);font-weight:400;font-size:.78rem}
.pr-item[aria-selected=true]{background:color-mix(in srgb,var(--pr-a) 10%,transparent)}
.pr-item[aria-selected=true] .ic{background:var(--c,var(--pr-a));color:#fff}
.pr-empty{padding:1.6rem;text-align:center;color:var(--mute,#8794ab);font-size:.92rem}
.pr-foot{display:flex;gap:1rem;padding:.65rem 1.1rem;border-top:1px solid var(--line,#e1e7f1);color:var(--mute,#8794ab);font-size:.74rem}

/* ---------- Toasts ---------- */
#pr-toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483200;display:flex;flex-direction:column;gap:.55rem;align-items:center;pointer-events:none;width:min(440px,92vw)}
.pr-toast{pointer-events:auto;display:flex;align-items:center;gap:.7rem;width:100%;padding:.8rem 1rem;border-radius:16px;background:#0f2142;color:#fff;
  font:500 .9rem "Instrument Sans",ui-sans-serif,sans-serif;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);border-left:4px solid var(--pr-b);
  animation:pr-toast .5s var(--pr-ease) both}
.pr-toast.ok{border-color:#22c55e}.pr-toast.err{border-color:#f43f5e}.pr-toast.warn{border-color:#f59e0b}
.pr-toast.out{animation:pr-toast-out .3s ease both}
.pr-toast button{margin-left:auto;background:none;border:0;color:#f1cf86;font-weight:600;cursor:pointer;font-family:inherit}
@keyframes pr-toast{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pr-toast-out{to{opacity:0;transform:translateY(8px) scale(.96)}}

/* ---------- Offline banner ---------- */
#pr-offline{position:fixed;top:0;left:0;right:0;z-index:2147482900;padding:.55rem 1rem;text-align:center;background:#b45309;color:#fff;font:600 .85rem "Instrument Sans",ui-sans-serif,sans-serif;
  transform:translateY(-100%);transition:transform .4s var(--pr-ease)}
#pr-offline.show{transform:none}

/* ---------- Coming-soon tiles ---------- */
.tile.pr-soon{cursor:not-allowed}
.tile.pr-soon .go{opacity:.4}
.pr-badge{position:absolute;top:14px;right:14px;z-index:2;padding:.25rem .6rem;border-radius:99px;font:700 .68rem "Instrument Sans",ui-sans-serif,sans-serif;letter-spacing:.06em;
  background:color-mix(in srgb,var(--pr-gold) 25%,#fff);color:#7a5a12;border:1px solid color-mix(in srgb,var(--pr-gold) 60%,#fff)}
html[data-mode="dark"] .pr-badge{background:#3a2d0e;color:#f1cf86;border-color:#5a4617}
.tile.pr-soon .ico{filter:grayscale(.7)}
.pr-fallback-logo{font:800 1.4rem "Bricolage Grotesque",ui-sans-serif,sans-serif;color:var(--c,var(--pr-a))}

/* ---------- Recent chips (home) ---------- */
.pr-recent{width:100%;max-width:1120px;margin:0 auto 1.25rem;display:flex;flex-wrap:wrap;align-items:center;gap:.55rem}
.pr-recent b{font:600 .82rem "Instrument Sans",ui-sans-serif,sans-serif;color:var(--ink2,#506078);margin-right:.2rem}
.pr-recent a{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .9rem;border-radius:99px;text-decoration:none;color:var(--ink,#0f2142);
  background:var(--surface,#fff);border:1px solid var(--line,#e1e7f1);font:500 .84rem "Instrument Sans",ui-sans-serif,sans-serif;transition:transform .3s var(--pr-ease),border-color .2s}
.pr-recent a i{color:var(--c,var(--pr-a));font-size:.8rem}
.pr-recent a:hover{transform:translateY(-2px);border-color:var(--c,var(--pr-a))}

/* ---------- 404 ---------- */
.pr-404{min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center}
.pr-404 h1{font:800 clamp(5rem,22vw,11rem)/1 "Bricolage Grotesque",ui-sans-serif,sans-serif;letter-spacing:-.05em;background:linear-gradient(135deg,var(--pr-deep),var(--pr-a) 60%,var(--pr-gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.pr-404 p{color:var(--ink2,#506078);margin:.4rem 0 1.6rem;font-size:1.05rem}
.pr-404 a{display:inline-flex;gap:.6rem;align-items:center;padding:.85rem 1.4rem;border-radius:14px;background:linear-gradient(135deg,var(--pr-a),var(--pr-b));color:#fff;text-decoration:none;font-weight:600;box-shadow:0 14px 26px -14px var(--pr-a)}

@media (prefers-reduced-motion:reduce){
  #pr-loader,#pr-loader *,.pr-toast,body{animation:none!important;transition:none!important}
}
@media print{#pr-loader,.pr-fab,.pr-floatbar,#pr-progress,#pr-toasts,#pr-pal,#pr-theme,#pr-offline{display:none!important}}

/* ==========================================================
   v2 additions: dialogs · shortcuts · quick menu · skip link ·
   focus ring · scrollbars · print
   ========================================================== */

/* ---------- Dialogs (confirm / prompt / notice) ---------- */
.pr-dlg{position:fixed;inset:0;z-index:2147483300;display:grid;place-items:center;padding:1rem;background:rgba(8,14,30,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  opacity:0;transition:opacity .2s ease}
.pr-dlg.open{opacity:1}
.pr-dlg-box{width:min(440px,100%);display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding:1.4rem 1.4rem 1.1rem;border-radius:20px;
  background:var(--surface,#fff);color:var(--ink,#0f2142);border:1px solid var(--line,#e1e7f1);box-shadow:0 40px 80px -30px rgba(0,0,0,.55);
  transform:translateY(10px) scale(.97);transition:transform .3s var(--pr-ease)}
.pr-dlg.open .pr-dlg-box{transform:none}
.pr-dlg-box.wide{width:min(500px,100%)}
.pr-dlg-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.05rem;color:var(--pr-a);background:color-mix(in srgb,var(--pr-a) 12%,transparent)}
.pr-dlg-box.danger .pr-dlg-ic{color:#d1344a;background:color-mix(in srgb,#d1344a 12%,transparent)}
.pr-dlg-body h3{margin:.1rem 0 .3rem;font:700 1.1rem/1.3 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif}
.pr-dlg-body p{margin:0;color:var(--ink2,#506078);font:400 .93rem/1.5 "Instrument Sans",ui-sans-serif,system-ui,sans-serif;white-space:pre-line}
.pr-dlg-in{width:100%;margin-top:.8rem;height:44px;padding:0 .9rem;border-radius:12px;border:1px solid var(--line,#d5dcea);background:var(--bg,#f8fafd);color:inherit;font:500 .95rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif;outline:none}
.pr-dlg-in:focus{border-color:var(--pr-b);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr-b) 20%,transparent)}
.pr-dlg-act{grid-column:1/-1;display:flex;justify-content:flex-end;gap:.55rem;margin-top:1.1rem}
.pr-btn{height:40px;padding:0 1.15rem;border:0;border-radius:12px;cursor:pointer;color:#fff;font:600 .9rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  background:linear-gradient(135deg,var(--pr-a),var(--pr-b));box-shadow:0 10px 20px -12px var(--pr-a);transition:transform .2s var(--pr-ease),filter .2s}
.pr-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}

.pr-btn.ghost{background:transparent;color:var(--ink2,#506078);box-shadow:none;border:1px solid var(--line,#d5dcea)}
.pr-btn.ghost:hover{background:color-mix(in srgb,var(--ink,#0f2142) 6%,transparent);filter:none}
.pr-btn.danger{background:linear-gradient(135deg,#be123c,#e11d48);box-shadow:0 10px 20px -12px #be123c}
.pr-btn:focus-visible,.pr-dlg-in:focus-visible{outline:3px solid var(--pr-gold);outline-offset:2px}

/* ---------- Shortcut list ---------- */
.pr-keys{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.1rem}
.pr-keys li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line,#e8edf5);font:500 .9rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif}
.pr-keys li:last-child{border-bottom:0}
.pr-keys .keys{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.pr-keys kbd{font:600 .74rem ui-monospace,SFMono-Regular,Menlo,monospace;padding:.18rem .5rem;border-radius:7px;background:color-mix(in srgb,var(--pr-a) 9%,transparent);color:var(--pr-a);border:1px solid color-mix(in srgb,var(--pr-a) 22%,transparent)}
.pr-keys em{font-style:normal;color:var(--mute,#8794ab);font-size:.78rem}

/* ---------- Quick menu (dashboard pages) ---------- */
.pr-quick{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:2147481000;width:42px;height:42px;border-radius:50%;
  border:2px solid #fff;cursor:pointer;display:grid;place-items:center;color:#fff;font:700 .82rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;
  background:linear-gradient(140deg,var(--pr-deep),var(--pr-a));box-shadow:0 12px 24px -10px color-mix(in srgb,var(--pr-a) 80%,transparent);

#pr-menu{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 52px);z-index:2147482600;width:min(290px,calc(100vw - 28px));padding:.5rem;border-radius:18px;

:where(input,textarea,select):focus-visible{outline:2px solid color-mix(in srgb,var(--pr-b) 80%,#fff);outline-offset:1px}

::selection{background:color-mix(in srgb,var(--pr-b) 35%,transparent)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

/* ---------- Print: clean report output for every dashboard ---------- */
@page{margin:10mm}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body{animation:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .sidebar,.topbar-actions,.back-row .back-btn,.cursor-glow,.aurora,.mesh,canvas#fx,.grain,.toast{display:none!important}
  .main{margin:0!important;padding:0!important;max-width:none!important}
  .view:not(.active){display:none!important}
  .card,.panel,.tile,.note{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}

  *{animation:none!important;transition:none!important}
}

/* ---------- Motion: minimal by default (html[data-motion="lite"]); "full" restores every effect ---------- */
.pr-mot{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.55rem;background:color-mix(in srgb,var(--ink,#0f2142) 6%,transparent);padding:.25rem;border-radius:12px}

html[data-motion=lite] :where(a,button,.card,.tile,.row,input,select,td,th,li,.btn,.pill,.chip){transition-duration:.12s!important}
html[data-motion=lite] :where(.aurora,.mesh,.grain,.cursor-glow,canvas#fx){display:none!important}
html[data-motion=lite] .tile{transform:none!important}
html[data-motion=lite].pr-leave body{filter:none;transform:none;transition:opacity .1s}
html[data-motion=lite] :where(.pr-dlg-box,#pr-menu){transition-duration:.12s!important}

.pd-bub{max-width:92%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.5;background:var(--pd-bg);border:1px solid var(--pd-line);animation:pd-in .3s var(--pd-ease) backwards}
.pd-bub.ai{align-self:flex-start;border-bottom-left-radius:6px}
.pd-bub.me{align-self:flex-end;color:#fff;border:0;background:linear-gradient(135deg,var(--pr-a,#1d4ed8),var(--pr-b,#3b82f6));border-bottom-right-radius:6px}
.pd-bub ul{list-style:none;margin:6px 0 0;padding:0}
.pd-bub li{padding:6px 0;border-bottom:1px dashed var(--pd-line)}
.pd-bub li:last-child{border-bottom:0}
.pd-bub .pd-dim{color:var(--pd-mute)}
.pd-ask{display:flex;gap:8px;padding:12px;border-top:1px solid var(--pd-line)}
.pd-ask input{flex:1;min-width:0;font:13px var(--pd-body);color:var(--pd-ink);background:var(--pd-bg);border:1px solid var(--pd-line);border-radius:12px;padding:10px 12px;outline:none}
.pd-ask input:focus{border-color:var(--pr-a,#1d4ed8)}

.pd-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 4px 0}
.pd-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pd-tab{font:600 12.5px var(--pd-body);color:var(--pd-mute);background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:all .2s var(--pd-ease)}
.pd-tab:hover{color:var(--pd-ink);transform:translateY(-1px)}
.pd-tab.on{color:#fff;background:linear-gradient(135deg,var(--pr-a,#1d4ed8),var(--pr-b,#3b82f6));border-color:transparent;box-shadow:0 8px 18px -10px var(--pr-a,#1d4ed8)}
.pd-tab:focus-visible,.pd-sort select:focus-visible{outline:2px solid var(--pr-a,#1d4ed8);outline-offset:2px}
.pd-sort{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--pd-mute)}
.pd-sort select{font:600 12.5px var(--pd-body);color:var(--pd-ink);background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:12px;padding:7px 10px;outline:none;cursor:pointer}
.pd-sort select:focus{border-color:var(--pr-a,#1d4ed8)}

/* ---------- small screens ---------- */
/* ---------- floating panel mode (opened from home / AMM tiles inside an overlay) ---------- */
html.pd-panel,html.pd-panel body{background:transparent!important;overflow-y:auto}
html.pd-panel body::before{display:none}
html.pd-panel .pd-wrap{max-width:none;padding:14px 14px 90px}
html.pd-panel .pd-top{top:0}
html.pd-panel .pd-back{display:none}
.pd-close-panel{display:none}
html.pd-panel .pd-close-panel{display:inline-flex}
html.pd-panel .pd-hero{margin-top:14px}
html.pd-panel .pd-bar{margin-top:14px}
@media (max-width:640px){
  .pd-wrap{padding:10px 12px 110px}
  .pd-top{top:8px;border-radius:16px}
  .pd-tools .pd-btn span{display:none}
  .pd-clock{display:none}
  .pd-grid{grid-template-columns:1fr 1fr;gap:10px}
  .pd-card{padding:14px 13px 12px}
  .pd-date{font-size:19px}
  .pd-stats{width:100%}
  .pd-stats div{flex:1;min-width:0}
    .pd-fab{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pd-wrap">

  <header class="pd-top">
    <div class="pd-brand">
      <span class="pd-mark"><i class="fas fa-layer-group"></i></span>
      <div><b>Prithvi Realcon</b><small>Pending · sheet change data</small></div>
    </div>
    <div class="pd-tools">
      <span class="pd-clock" id="pdClock"></span>
      <a class="pd-btn pd-back" href="home_page.html" aria-label="Back" title="Back"><i class="fas fa-arrow-left"></i></a>
      <button class="pd-btn pd-close-panel" id="pdPanelClose" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
      <button class="pd-btn" id="pdTheme" type="button" aria-label="Change theme" title="Change theme"></button>
          </div>
  </header>

  <main>
    <div class="pd-hero">
      <div>
        <h1>Pending</h1>
        <p>Latest change in each sheet, in one place.</p>
      </div>
      <div class="pd-stats">
        <div><b id="stTotal">0</b><span>Sources</span></div>
        <div><b id="stOk">0</b><span>Current</span></div>
        <div><b id="stLate">0</b><span>Pending</span></div>
      </div>
    </div>
    <div class="pd-bar">
      <nav class="pd-tabs" id="pdTabs" role="tablist" aria-label="Sections"></nav>
      <label class="pd-sort"><span>Sort</span>
        <select id="pdSort" aria-label="Sort cards">
          <option value="new">Latest first</option>
          <option value="old">Oldest first</option>
          <option value="name">Name A–Z</option>
        </select>
      </label>
    </div>
    <div id="pdSections"></div>
    <p class="pd-foot" id="pdStamp">Loading…</p>
  </main>
</div>



<script>
(function () {
  'use strict';
  var IN_PANEL = /[?&]panel=1/.test(location.search);
  if (IN_PANEL) document.documentElement.classList.add('pd-panel');

  /* ================= SOURCES (anon keys copied from the portal pages) ================= */
  var SRC = {
    pycm: { url: 'https://pycmkjrmdieaqsbgrher.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5Y21ranJtZGllYXFzYmdyaGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMjMxNzAsImV4cCI6MjEwNjU5OTE3MH0.9IE2c2FZ4BPv6Rvhfa_VniQ7LJvQ_c4EGDXFihYR4Lc' },
    jzkr: { url: 'https://jzkrywwrsewchtiqsczk.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6a3J5d3dyc2V3Y2h0aXFzY3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NDU0MzQsImV4cCI6MjEwNzEyMTQzNH0.IDwfVhqDI9uXfAALCVKBD0pNjsNVu38fW4eEueaKDSs' },
    gced: { url: 'https://gcedsyxvfmlyujhftiyf.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjZWRzeXh2Zm1seXVqaGZ0aXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Mjg5ODMsImV4cCI6MjExMDIwNDk4M30.QsFXFMT1zS62UIfdbgtpXJHEicCVglvXHqgvik5Q5Rk' },
    lfls: { url: 'https://lflsewvyhyfmuegksscy.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbHNld3Z5aHlmbXVlZ2tzc2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTY3MjIsImV4cCI6MjEwNzAzMjcyMn0.BKNDWGKs4MX7MFL4FD0ECesgFciFmMRpMdmQUnARj7s' }
  };

  /* ================= GROUPS ================= */
  var GROUPS = [
    { id: 'amm',   title: 'AMM',        hint: 'Party wise',           icon: 'fa-industry',          c: '#1d4ed8' },
    { id: 'rcr',   title: 'RCR',        hint: 'Last Excel upload',    icon: 'fa-train',             c: '#0f8a6a' },
    { id: 'daily', title: 'Daily Rake', hint: 'Last data filled',     icon: 'fa-calendar-check',    c: '#c2410c' },
    { id: 'coal',  title: 'Coal India', hint: 'Dispatch dashboard',   icon: 'fa-chart-column',      c: '#7c3aed' },
    { id: 'odr',   title: 'ODR',        hint: 'Last Excel upload',    icon: 'fa-file-excel',        c: '#be185d' }
  ];

  /* ================= CARDS =================
     cols  = date columns tried in order (first one that exists is used)
     kind  = 'upload' (Excel upload date) or 'entry' (last data filled)
     detail = adds the "Last rake · Recv / Rake 2" expander */
  var ITEMS = [
    { g: 'amm',   name: 'Gujarat',            src: 'pycm', table: 'gujarat_rake_records', cols: ['date', 'rake_date', 'created_at'], kind: 'entry',  detail: true },
    { g: 'amm',   name: 'HZL',                src: 'pycm', table: 'hzl_rake_records',     cols: ['date', 'rake_date', 'created_at'], kind: 'entry',  detail: true },
    { g: 'amm',   name: 'NALCO',              src: 'gced', table: 'nalco_rake_records',   cols: ['date', 'created_at'],             kind: 'entry',  detail: true },
    { g: 'amm',   name: 'PJPB',               src: 'pycm', table: 'pjpb_mis_imports',     cols: ['imported_at', 'created_at'],      kind: 'upload' },
    { g: 'amm',   name: 'BALCO',              src: 'gced', table: 'dashboard',            cols: ['updated_at'],                     kind: 'upload' },
    { g: 'rcr',   name: 'HZL',                src: 'gced', table: 'hzl_do',               cols: ['updated_at'],                     kind: 'upload' },
    { g: 'rcr',   name: 'Jhabua',             src: 'lfls', table: 'jhabua_sub_group',     cols: ['updated_at', 'created_at'],       kind: 'upload' },
    { g: 'daily', name: 'Daily Rake Loading', src: 'jzkr', table: 'amm_daily_entries',    cols: ['report_date'],                    kind: 'entry' },
    { g: 'coal',  name: 'Dispatch Dashboard', src: 'jzkr', table: 'dispatch_entries',     cols: ['uploaded_at', 'created_at', 'entry_date'], kind: 'upload' },
    { g: 'odr',   name: 'HZL ODR',            src: 'jzkr', table: 'HZL_ODR',              cols: ['uploaded_at', 'created_at'],      kind: 'upload' },
    { g: 'odr',   name: 'NALCO ODR',          src: 'jzkr', table: 'NALCO_ODR',            cols: ['uploaded_at', 'created_at'],      kind: 'upload' }
  ];

  var STATE = [];   // one entry per ITEMS index
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

  /* ================= dates ================= */
  function toDay(v) {
    if (!v) return null;
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      var p = v.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]);
    }
    var x = new Date(v); if (isNaN(x)) return null;
    return new Date(x.getFullYear(), x.getMonth(), x.getDate());
  }
  function dayDiff(d) {
    var t = new Date(); var today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((today - d) / 864e5);
  }
  function fmtDay(d) { return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
  function agoText(n) { return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days ago'; }
  function tone(n) { return n == null ? 'mute' : n <= 1 ? 'ok' : n <= 3 ? 'warn' : 'late'; }
  var TONE_TXT = { ok: 'Current', warn: 'Due', late: 'Pending', mute: 'No date' };

  /* ================= data ================= */
  function sbGet(src, table, order) {
    var s = SRC[src];
    var p = new URLSearchParams({ select: '*', limit: '1' });
    if (order) p.set('order', order + '.desc.nullslast');
    return fetch(s.url + '/rest/v1/' + encodeURIComponent(table) + '?' + p.toString(), {
      headers: { apikey: s.key, Authorization: 'Bearer ' + s.key, Accept: 'application/json' }
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) {
        var m = ''; try { var j = JSON.parse(t); m = j.message || j.hint || ''; } catch (e) { m = t; }
        throw new Error(r.status + (m ? ' · ' + m : ''));
      });
      return r.json();
    });
  }
  function loadItem(it) {
    var lastErr = null, i = 0;
    function tryCol() {
      if (i >= it.cols.length) {
        // no date column worked: at least confirm the table is reachable
        return sbGet(it.src, it.table, null).then(function (rows) {
          return { col: null, row: rows[0] || null, err: null, noDate: true };
        }, function (e) { return { col: null, row: null, err: (lastErr || e).message }; });
      }
      var col = it.cols[i++];
      return sbGet(it.src, it.table, col).then(function (rows) {
        return { col: col, row: rows[0] || null, err: null };
      }, function (e) { lastErr = e; return tryCol(); });
    }
    return tryCol();
  }

  /* ================= render ================= */
  function view(st) {
    var raw = st.col && st.row ? st.row[st.col] : null;
    var d = toDay(raw);
    return { d: d, n: d ? dayDiff(d) : null, raw: raw, col: st.col, row: st.row, noDate: !st.col };
  }
  function pick(row, keys) {
    for (var k = 0; k < keys.length; k++) { var v = row && row[keys[k]]; if (v != null && v !== '') return v; }
    return null;
  }
  function prettyKey(k) { return k.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function valText(v) {
    if (v == null || v === '') return '—';
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) { var d = toDay(v); return d ? fmtDay(d) : v; }
    return String(v);
  }

  function cardHTML(it, st, i) {
    if (!st) return '<article class="pd-card pd-skel" style="--i:' + i + '"></article>';
    if (st.err) {
      return '<article class="pd-card" style="--i:' + i + ';--c:#dc2626">' +
        '<div class="pd-card-top"><span class="pd-name">' + esc(it.name) + '</span><span class="pd-status late"><i></i>Error</span></div>' +
        '<div class="pd-err"><i class="fas fa-circle-exclamation"></i><span>' + esc(st.err) + '</span></div>' +
        '<div class="pd-src">' + esc(it.table) + '</div></article>';
    }
    var v = view(st);
    var kindTxt = it.kind === 'upload' ? 'Excel upload' : 'Last data filled';
    var t = v.noDate ? 'mute' : tone(v.n);
    var dateTxt = v.d ? fmtDay(v.d) : (v.noDate ? 'No date column' : 'No rows yet');
    var timeTxt = (v.raw && String(v.raw).indexOf('T') > -1) ? ' · ' + new Date(v.raw).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
    var sub = v.d ? kindTxt + ' · ' + agoText(v.n) + timeTxt
                  : (v.noDate ? 'Add an uploaded_at column to show the upload date' : kindTxt);

    var detail = '';
    if (it.detail && v.row) {
      var lastRake = pick(v.row, ['rake_no', 'rake_number', 'rake', 'rr_no', 'sr_no']);
      var recv = Object.keys(v.row).filter(function (k) {
        return k !== v.col && /recv|rake.?2/i.test(k) && v.row[k] != null && v.row[k] !== '';
      }).map(function (k) { return [prettyKey(k), valText(v.row[k])]; });
      if (!recv.length) recv = [['Recv / Rake 2', '—']];
      var rows = [['Record date', dateTxt], ['Last rake', valText(lastRake)]].concat(recv);
      detail = '<button class="pd-more" type="button" data-more="' + i + '" aria-expanded="false"><i class="fas fa-chevron-down"></i>Last rake · Recv / Rake 2</button>' +
        '<div class="pd-inner" id="pd-in-' + i + '" hidden>' +
        rows.map(function (r) { return '<div class="pd-row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') +
        '</div>';
    }

    return '<article class="pd-card" style="--i:' + i + ';--c:' + groupColor(it.g) + '">' +
      '<div class="pd-card-top"><span class="pd-name">' + esc(it.name) + '</span>' +
      '<span class="pd-status ' + t + '"><i></i>' + TONE_TXT[t] + '</span></div>' +
      '<div class="pd-date">' + esc(dateTxt) + '</div>' +
      '<div class="pd-sub">' + esc(sub) + '</div>' +
      '<div class="pd-src">' + esc(it.table) + ' · ' + esc(v.col || 'no date column') + '</div>' +
      detail + '</article>';
  }
  function groupColor(id) { for (var g of GROUPS) if (g.id === id) return g.c; return '#1d4ed8'; }

  var TAB = 'all', SORT = 'new';
  function sortIdx(list) {
    function key(i) { var st = STATE[i]; if (!st || st.err) return null; var v = view(st); return v.d ? v.d.getTime() : null; }
    return list.slice().sort(function (a, b) {
      if (SORT === 'name') return ITEMS[a].name.localeCompare(ITEMS[b].name);
      var ka = key(a), kb = key(b);
      if (ka == null && kb == null) return a - b;
      if (ka == null) return 1;
      if (kb == null) return -1;
      return SORT === 'old' ? ka - kb : kb - ka;
    });
  }
  function renderAll() {
    var html = '';
    GROUPS.forEach(function (g) {
      if (TAB !== 'all' && TAB !== g.id) return;
      var idx = ITEMS.map(function (it, i) { return i; }).filter(function (i) { return ITEMS[i].g === g.id; });
      var cards = sortIdx(idx).map(function (i) { return cardHTML(ITEMS[i], STATE[i], i); }).join('');
      html += '<section class="pd-sec" style="--c:' + g.c + '">' +
        '<div class="pd-sec-head"><span class="pd-sec-ico"><i class="fas ' + g.icon + '"></i></span>' +
        '<h2>' + esc(g.title) + '</h2><span class="pd-pill">' + esc(g.hint) + '</span></div>' +
        '<div class="pd-grid">' + cards + '</div></section>';
    });
    $('#pdSections').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.pd-tab'), function (t) {
      var on = t.getAttribute('data-tab') === TAB;
      t.classList.toggle('on', on); t.setAttribute('aria-selected', String(on));
    });
    updateStats();
  }
  function updateStats() {
    var ok = 0, late = 0;
    ITEMS.forEach(function (it, i) {
      var st = STATE[i]; if (!st || st.err) { late++; return; }
      var v = view(st); if (v.noDate || v.n == null) { late++; return; }
      if (tone(v.n) === 'ok') ok++; else if (tone(v.n) === 'late') late++;
    });
    $('#stTotal').textContent = ITEMS.length;
    $('#stOk').textContent = ok;
    $('#stLate').textContent = late;
  }

  function load() {
    if (!STATE.length) { renderAll(); }
    return Promise.all(ITEMS.map(loadItem)).then(function (res) {
      STATE = res;
      renderAll();
      $('#pdStamp').textContent = 'Updated ' + new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    });
  }

  /* ================= theme + clock ================= */
  function getMode() {
    var m = null; try { m = localStorage.getItem('pend-mode'); } catch (e) {}
    if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    return m;
  }
  function applyMode(m) {
    document.documentElement.setAttribute('data-pm', m);
    try { localStorage.setItem('pend-mode', m); } catch (e) {}
    $('#pdTheme').innerHTML = m === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }
  function tick() {
    $('#pdClock').textContent = new Date().toLocaleString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  /* ================= events ================= */
  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-more]');
    if (m) {
      var box = document.getElementById('pd-in-' + m.getAttribute('data-more'));
      box.hidden = !box.hidden;
      m.classList.toggle('open', !box.hidden);
      m.setAttribute('aria-expanded', String(!box.hidden));
    }
  });
  $('#pdTheme').addEventListener('click', function () {
    applyMode(document.documentElement.getAttribute('data-pm') === 'dark' ? 'light' : 'dark');
  });

  function askClose() {
    if (IN_PANEL && window.parent !== window) window.parent.postMessage({ type: 'pending-close' }, location.origin);
  }
  $('#pdPanelClose').addEventListener('click', askClose);
  if (IN_PANEL) document.addEventListener('keydown', function (e) { if (e.key === 'Escape') askClose(); });

  $('#pdTabs').innerHTML = '<button class="pd-tab on" type="button" role="tab" data-tab="all">All</button>' +
    GROUPS.map(function (g) { return '<button class="pd-tab" type="button" role="tab" data-tab="' + g.id + '">' + esc(g.title) + '</button>'; }).join('');
  $('#pdTabs').addEventListener('click', function (e) {
    var t = e.target.closest('.pd-tab'); if (!t) return;
    TAB = t.getAttribute('data-tab'); renderAll();
  });
  $('#pdSort').addEventListener('change', function (e) { SORT = e.target.value; renderAll(); });

  /* ================= start ================= */
  applyMode(getMode());
  tick(); setInterval(tick, 30000);
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
