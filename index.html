<style>
:root{
  --bg:#f5f8fc; --surface:#ffffff; --ink:#0f2142; --ink2:#51607a; --mute:#8794ab;
  --line:#e0e6f0; --brand:#1d4ed8; --brand2:#3b82f6; --ok:#0f8a6a; --err:#d1344a;
  --head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:var(--bg);overflow-x:hidden;overflow-y:auto;position:relative;
  transition:opacity .45s var(--ease),filter .45s var(--ease);
}
body.leave{opacity:0;filter:blur(6px)}

/* ambient mesh */
.mesh{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
.b1{width:48vmax;height:48vmax;background:#b9d0ff;left:-12vmax;top:-14vmax}
.b2{width:42vmax;height:42vmax;background:#bdf0de;right:-14vmax;top:8vh;animation-duration:27s;animation-delay:-6s}
.b3{width:46vmax;height:46vmax;background:#e4d6ff;left:18vw;bottom:-20vmax;animation-duration:31s;animation-delay:-12s}
.b4{width:30vmax;height:30vmax;background:#ffe3c7;right:14vw;bottom:-8vmax;animation-duration:24s;animation-delay:-3s;opacity:.45}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.08)}100%{transform:translate3d(-4vw,8vh,0) scale(.95)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
/* cursor spotlight */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),rgba(59,130,246,.13),transparent 70%);
}

/* entrance */
.wrap{position:relative;z-index:1;width:100%;max-width:390px;animation:rise .8s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.wrap.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* tilt card */
.card{
  position:relative;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:24px;padding:2.2rem 2rem 2rem;
  box-shadow:0 1px 2px rgba(15,33,66,.05),0 30px 60px -28px rgba(15,33,66,.35);
  transform-style:preserve-3d;transition:transform .45s var(--ease),box-shadow .45s var(--ease);
  will-change:transform;
}
.card:hover{box-shadow:0 1px 2px rgba(15,33,66,.05),0 40px 70px -30px rgba(15,33,66,.45)}
.card::before{ /* animated gradient border sheen */
  content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(59,130,246,.65),transparent 85%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6s linear infinite;opacity:.8;
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}

/* logo */
.mark{
  position:relative;width:60px;height:60px;margin:0 auto 1.1rem;border-radius:18px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:1.4rem;box-shadow:0 14px 26px -14px rgba(15,33,66,.6);
  animation:float 4s ease-in-out infinite;transition:transform .4s var(--ease);
}
.mark::after{content:"";position:absolute;inset:-8px;border-radius:24px;border:2px solid rgba(59,130,246,.35);animation:pulse 2.6s var(--ease) infinite}
.card:hover .mark{transform:rotate(-6deg) scale(1.06)}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}

.head{font-family:var(--head);font-weight:700;letter-spacing:-.02em;font-size:1.6rem;text-align:center;min-height:1.9rem;line-height:1.2}
.type::after{content:"";display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.08em;background:var(--brand);animation:blink .9s steps(1) infinite}
.type.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.sub{text-align:center;color:var(--ink2);font-size:.9rem;margin:.35rem 0 1.6rem;animation:fade .8s var(--ease) .6s backwards}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* fields */
.f{position:relative;margin-bottom:1rem;animation:rise .6s var(--ease) backwards;animation-delay:var(--d,.4s)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--ink2);margin-bottom:.35rem;letter-spacing:.01em}
.field{position:relative}
.field>i.lead{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--mute);font-size:.9rem;transition:color .25s,transform .35s var(--ease);pointer-events:none}
input{
  width:100%;height:48px;padding:0 2.6rem 0 2.7rem;border:1px solid var(--line);border-radius:13px;
  background:#f8fafd;font:500 .95rem var(--body);color:var(--ink);outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
input::placeholder{color:#a6b0c3}
input:hover{border-color:#cdd7e6}
input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(59,130,246,.15);background:#fff}
.field:focus-within>i.lead{color:var(--brand);transform:translateY(-50%) scale(1.12)}
.eye{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s}
.eye:hover{color:var(--brand);background:#eef3ff}
.caps{display:none;align-items:center;gap:.4rem;margin-top:.45rem;font-size:.78rem;color:#b7791f;font-weight:600}
.caps.on{display:flex;animation:rise .35s var(--ease)}

.row{display:flex;justify-content:space-between;align-items:center;margin:.2rem 0 1.1rem;font-size:.85rem;color:var(--ink2);animation:rise .6s var(--ease) backwards;animation-delay:.55s}
.check{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:18px;height:18px;border-radius:6px;border:1.5px solid #cdd7e6;display:grid;place-items:center;background:#fff;transition:all .25s var(--ease)}
.box i{font-size:.6rem;color:#fff;transform:scale(0);transition:transform .25s var(--ease)}
.check input:checked+.box{background:var(--brand);border-color:var(--brand)}
.check input:checked+.box i{transform:scale(1)}
.check input:focus-visible+.box{box-shadow:0 0 0 4px rgba(59,130,246,.2)}

/* button */
.go{
  position:relative;width:100%;height:50px;border:0;border-radius:13px;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:600 1rem var(--body);
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  box-shadow:0 12px 24px -12px rgba(29,78,216,.75);
  transition:transform .25s var(--ease),box-shadow .3s,background .4s,filter .25s;
  animation:rise .6s var(--ease) backwards;animation-delay:.65s;
}
.go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 30px -14px rgba(29,78,216,.85)}
.go:active:not(:disabled){transform:translateY(0) scale(.985)}
.go:disabled{cursor:progress}
.go .sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease);pointer-events:none}
.go:hover:not(:disabled) .sheen{transform:translateX(120%)}
.go .ic{transition:transform .3s var(--ease)}
.go:hover:not(:disabled) .ic{transform:translateX(4px)}
.go .ok-ic,.go .spin{display:none}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.go.loading .lbl,.go.loading .ic{display:none}
.go.loading .spin{display:inline-block}
.go.ok{background:linear-gradient(135deg,var(--ok),#22c55e);box-shadow:0 12px 24px -12px rgba(15,138,106,.8)}
.go.ok .ic{display:none}
.go.ok .ok-ic{display:inline-block;animation:pop .45s var(--ease)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

.notice{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1.1rem;padding:.7rem .85rem;border-radius:12px;font-size:.84rem;line-height:1.4;font-weight:500;
  color:#7a5410;background:#fdf3de;border:1px solid #f1d9a3;animation:rise .5s var(--ease) backwards}
.notice[hidden]{display:none}
.notice i{margin-top:.15rem}
.help{margin-top:1.1rem;text-align:center;font-size:.8rem;color:var(--mute)}
.nojs{max-width:390px;margin:0 auto;padding:1rem 1.2rem;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink2);text-align:center;font-size:.92rem}
.err{min-height:1.3rem;margin-top:.9rem;text-align:center;color:var(--err);font-size:.87rem;font-weight:500;transition:opacity .3s}
.err.hide{opacity:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (hover:none){.card:hover,.card:hover .mark{transform:none}}
@media (max-width:420px){.card{padding:1.8rem 1.4rem 1.6rem}}
</style>

<style id="prtpl-css">
/* ==========================================================
   Prithvi Realcon – shared UI layer (prtpl.css)
   Preloader · page transitions · toasts · command palette ·
   colour themes · dark mode · scroll progress · back-to-top
   ========================================================== */

:root{
  --pr-a:#1d4ed8; --pr-b:#3b82f6; --pr-deep:#0f2142; --pr-gold:#d9ac4e;
  --pr-o1:#bcd2ff; --pr-o2:#c3f1e1; --pr-o3:#fde7bd;
  --pr-ease:cubic-bezier(.16,1,.3,1);
}

/* ---------- Colour templates ---------- */
html[data-theme="emerald"]{--pr-a:#0f8a6a;--pr-b:#22c55e;--pr-deep:#073b2e;--pr-gold:#e0b050;--pr-o1:#b6efd9;--pr-o2:#cfe8ff;--pr-o3:#fdf0c4}
html[data-theme="violet"]{--pr-a:#6d28d9;--pr-b:#a78bfa;--pr-deep:#24124d;--pr-gold:#f0b429;--pr-o1:#ddd0ff;--pr-o2:#c9e8ff;--pr-o3:#ffd9e8}
html[data-theme="sunset"]{--pr-a:#c2410c;--pr-b:#f59e0b;--pr-deep:#3b1606;--pr-gold:#f7c948;--pr-o1:#ffd6b8;--pr-o2:#ffe9a8;--pr-o3:#ffc9d6}
html[data-theme="rose"]{--pr-a:#be185d;--pr-b:#f472b6;--pr-deep:#3d0a24;--pr-gold:#f3b95f;--pr-o1:#ffd0e3;--pr-o2:#ffe0c2;--pr-o3:#e6d5ff}
html[data-theme="teal"]{--pr-a:#0e7490;--pr-b:#22d3ee;--pr-deep:#073642;--pr-gold:#e6b450;--pr-o1:#b8ecf7;--pr-o2:#c3f1e1;--pr-o3:#fdeabd}

/* Theme-aware surfaces (hub pages only: index, home, AMM, ODR, notices, 404) */
html[data-hub] .orb.o1,html[data-hub] .blob.b1{background:var(--pr-o1)}
html[data-hub] .orb.o2,html[data-hub] .blob.b2{background:var(--pr-o2)}
html[data-hub] .orb.o3,html[data-hub] .blob.b3{background:var(--pr-o3)}
html[data-hub] .mark{background:linear-gradient(140deg,var(--pr-deep),var(--pr-a))!important}
html[data-hub="grid"] .head{background-image:linear-gradient(180deg,var(--ink) 30%,var(--pr-a) 150%)}
html[data-hub] .site-footer{background:linear-gradient(135deg,var(--pr-deep) 0%,color-mix(in srgb,var(--pr-a) 70%,var(--pr-deep)) 60%,var(--pr-a) 125%)!important}
html[data-hub] .go[type=submit],html[data-hub] button.go{background:linear-gradient(135deg,var(--pr-a),var(--pr-b))}
html[data-hub] .type::after{background:var(--pr-gold)}
html[data-hub] .cursor-glow{background:radial-gradient(circle,color-mix(in srgb,var(--pr-a) 14%,transparent),transparent 65%)}
html[data-hub] input:focus{border-color:var(--pr-b);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr-b) 20%,transparent)}
html[data-hub] a:focus-visible,html[data-hub] button:focus-visible{outline-color:var(--pr-a)}
html[data-hub] .check input:checked+.box{background:var(--pr-a);border-color:var(--pr-a)}

/* ---------- Dark mode (hub pages) ---------- */
html[data-mode="dark"]{color-scheme:dark;--pr-o1:#1b3270;--pr-o2:#0f4a3b;--pr-o3:#4a3410}
html[data-mode="dark"][data-hub]{
  --bg:#0a1020;--surface:#111a2e;--ink:#e8eefc;--ink2:#a9b6d0;--mute:#7886a3;--line:#22304d;
}
html[data-mode="dark"][data-hub] body{background:linear-gradient(180deg,#0a1020 0%,#0b1325 60%,#09101f 100%)!important}
html[data-mode="dark"][data-hub] .orb,html[data-mode="dark"][data-hub] .blob{opacity:.38}
html[data-mode="dark"][data-hub] .grain{opacity:.06}
html[data-mode="dark"][data-hub] .top{background:rgba(17,26,46,.78)}
html[data-mode="dark"][data-hub] .back,html[data-mode="dark"][data-hub] .eye:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
html[data-mode="dark"][data-hub] .tile,html[data-mode="dark"][data-hub] .note,html[data-mode="dark"][data-hub] .card{background:rgba(17,26,46,.88)!important;border-color:var(--line)}
html[data-mode="dark"][data-hub] .tile:hover{border-color:color-mix(in srgb,var(--c) 70%,#000)}
html[data-mode="dark"][data-hub] .ico{background:color-mix(in srgb,var(--c,var(--pr-a)) 20%,#111a2e)!important;border-color:color-mix(in srgb,var(--c,var(--pr-a)) 35%,#111a2e)!important}
html[data-mode="dark"][data-hub] .ico img{background:#fff;border-radius:10px;padding:4px}
html[data-mode="dark"][data-hub] .go{background:#18233d;border-color:var(--line)}
html[data-mode="dark"][data-hub] .inspire{background:linear-gradient(120deg,#2a2210,#241d0e 60%,#2b2311);border-color:#4d3d17}
html[data-mode="dark"][data-hub] .inspire-title{color:#f1d9a0}
html[data-mode="dark"][data-hub] .inspire-title em{color:var(--pr-gold)}
html[data-mode="dark"][data-hub] input{background:#0d1528;border-color:var(--line);color:var(--ink)}
html[data-mode="dark"][data-hub] input:focus{background:#0f1a33}
html[data-mode="dark"][data-hub] .box{background:#0d1528;border-color:#33466b}
html[data-mode="dark"][data-hub] .btn{background:var(--pr-a);color:#fff}
html[data-mode="dark"][data-hub] .note .tag,html[data-mode="dark"][data-hub] .note .ico{background:color-mix(in srgb,var(--c) 22%,#111a2e);color:color-mix(in srgb,var(--c) 55%,#fff)}
html[data-mode="dark"][data-hub] .card::before{opacity:.5}

/* ---------- Preloader ---------- */
html.pr-loading{overflow:hidden}
#pr-loader{
  position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 50% 38%,#ffffff 0%,#f1f6ff 55%,#e6eefb 100%);
  transition:opacity .55s var(--pr-ease),visibility .55s,transform .7s var(--pr-ease);
}
html[data-mode="dark"] #pr-loader{background:radial-gradient(1200px 700px at 50% 38%,#14203b 0%,#0b1325 60%,#070c18 100%)}
#pr-loader.out{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
.pr-stage{display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center;padding:1.5rem}
.pr-anim{position:relative;width:min(240px,56vw);aspect-ratio:1;display:grid;place-items:center}
.pr-anim>*{grid-area:1/1}
.pr-anim svg,.pr-anim dotlottie-player,.pr-anim canvas{width:100%!important;height:100%!important}
.pr-fallback{display:grid;place-items:center;transition:opacity .4s}
.pr-fallback.hide{opacity:0}
.pr-ring{width:150px;height:150px;border-radius:50%;border:4px solid color-mix(in srgb,var(--pr-a) 18%,transparent);border-top-color:var(--pr-a);border-right-color:var(--pr-b);animation:pr-rot 1s linear infinite;position:relative}
.pr-fallback .pr-mk svg{width:38px;height:38px;fill:#fff}
.pr-fallback .pr-mk{position:absolute;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:1.35rem;
  background:linear-gradient(140deg,var(--pr-deep),var(--pr-a));box-shadow:0 14px 26px -12px color-mix(in srgb,var(--pr-a) 80%,transparent);animation:pr-bob 1.6s ease-in-out infinite}
.pr-name{font:700 1.1rem/1.2 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--pr-deep)}
html[data-mode="dark"] .pr-name{color:#e8eefc}
.pr-bar{width:min(220px,60vw);height:4px;border-radius:99px;background:color-mix(in srgb,var(--pr-a) 15%,transparent);overflow:hidden}
.pr-bar i{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--pr-a),var(--pr-b),var(--pr-gold));animation:pr-slide 1.25s var(--pr-ease) infinite}
@keyframes pr-rot{to{transform:rotate(360deg)}}
@keyframes pr-bob{50%{transform:translateY(-5px) scale(1.04)}}
@keyframes pr-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

/* ---------- Page transitions ---------- */
html.pr-leave body{opacity:0;filter:blur(5px);transform:translateY(-6px);transition:opacity .24s ease,filter .24s ease,transform .24s ease}
body{animation:pr-in .6s var(--pr-ease) both}
@keyframes pr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Scroll progress ---------- */
#pr-progress{position:fixed;left:0;top:0;height:3px;width:0;z-index:2147482000;background:linear-gradient(90deg,var(--pr-a),var(--pr-b),var(--pr-gold));
  box-shadow:0 0 10px color-mix(in srgb,var(--pr-b) 60%,transparent);pointer-events:none;transition:width .1s linear,opacity .3s}

/* ---------- Floating controls ---------- */
.pr-fab{
  position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:2147481000;
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;display:grid;place-items:center;
  color:#fff;font-size:1rem;background:linear-gradient(135deg,var(--pr-a),var(--pr-b));
  box-shadow:0 14px 28px -12px color-mix(in srgb,var(--pr-a) 85%,transparent);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .3s,transform .4s var(--pr-ease)
}
.pr-fab.show{opacity:1;transform:none;pointer-events:auto}
.pr-fab:hover{transform:translateY(-3px)}
.pr-fab:focus-visible{outline:3px solid var(--pr-gold);outline-offset:3px}

/* ---------- Header chips (palette + theme) ---------- */
.pr-chipbtn{
  display:inline-flex;align-items:center;gap:.5rem;height:36px;padding:0 .8rem;border-radius:999px;cursor:pointer;
  background:var(--surface,#fff);border:1px solid var(--line,#e1e7f1);color:var(--ink,#0f2142);font:500 .84rem "Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  transition:transform .3s var(--pr-ease),border-color .2s,box-shadow .3s
}
.pr-chipbtn:hover{transform:translateY(-1px);border-color:var(--pr-b);box-shadow:0 8px 18px -12px var(--pr-a)}
.pr-chipbtn kbd{font:600 .68rem ui-monospace,monospace;padding:.1rem .35rem;border-radius:6px;background:color-mix(in srgb,var(--pr-a) 10%,transparent);color:var(--pr-a)}

    <h1 class="head type" id="title"></h1>
    <p class="sub">Sign in to Prithvi Realcon</p>

    <div class="notice" id="notice" role="status" hidden><i class="fas fa-circle-info" aria-hidden="true"></i><span id="noticeTxt"></span></div>

    <form id="f" autocomplete="off" novalidate>
      <div class="f" style="--d:.4s">
        <label for="u">Username</label>
        <div class="field">
          <i class="fas fa-user lead"></i>
          <input id="u" autofocus placeholder="Enter username" autocomplete="username" />
        </div>
      </div>

      <div class="f" style="--d:.5s">
        <label for="p">Password</label>
        <div class="field">
          <i class="fas fa-lock lead"></i>
          <input id="p" type="password" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" class="eye" id="eye" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>
        <div class="caps" id="caps"><i class="fas fa-triangle-exclamation"></i>Caps Lock is on</div>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" />
          <span class="box"><i class="fas fa-check"></i></span>
          Remember username
        </label>
      </div>

      <button class="go" type="submit" id="go">
        <span class="sheen"></span>
        <span class="lbl">Login</span>
        <i class="fas fa-arrow-right ic"></i>
        <i class="fas fa-check ok-ic"></i>
        <span class="spin"></span>
      </button>
      <div class="err hide" id="err" role="alert"></div>
    </form>
    <p class="help">Need an account or access to a dashboard? Ask your administrator.</p>
  </div>
</div>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.getAttribute('data-motion') !== 'full';
const $ = id => document.getElementById(id);

/* typing heading */
function typeText(el, text, speed) {
  el.textContent = '';
  if (reduce) { el.textContent = text; el.classList.add('done'); return; }
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, i);
    if (i < text.length) { i++; setTimeout(step, speed || 75); }
    else el.classList.add('done');
  })();
}
typeText($('title'), 'Welcome back');

/* floating particles */
(function () {
  const c = $('fx'), ctx = c.getContext('2d');
  let W, H, P = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() {
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(70, Math.floor(W * H / 24000));
    P = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() * 1.6 + .6
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(29,78,216,.35)'; ctx.fill();
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) {
        ctx.strokeStyle = 'rgba(29,78,216,' + (.14 * (1 - d / 130)) + ')';
        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); frame();
  window.addEventListener('resize', () => { size(); if (reduce) frame(); });
})();

/* cursor spotlight + 3D tilt */
document.addEventListener('pointermove', e => {
  document.body.style.setProperty('--mx', e.clientX + 'px');
  document.body.style.setProperty('--my', e.clientY + 'px');
});
const card = $('card');
card.addEventListener('pointermove', e => {
  if (reduce || e.pointerType === 'touch') return;
  const r = card.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  card.style.transform = `perspective(1000px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg)`;
});
card.addEventListener('pointerleave', () => { card.style.transform = ''; });

/* ripple on button */
$('go').addEventListener('pointerdown', e => {
  if (reduce) return;
  const b = e.currentTarget, r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
  const d = document.createElement('span');
  d.className = 'ripple';
  d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(d); setTimeout(() => d.remove(), 650);
});

/* show / hide password */
$('eye').onclick = function () {
  const p = $('p'), i = this.querySelector('i');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  i.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
};

/* caps lock warning */
function caps(e) { $('caps').classList.toggle('on', !!(e.getModifierState && e.getModifierState('CapsLock'))); }
$('p').addEventListener('keydown', caps);
$('p').addEventListener('keyup', caps);
$('p').addEventListener('blur', () => $('caps').classList.remove('on'));

/* remember username (per browser, optional) */
const REM = 'prc-remember-user';
try {
  const saved = localStorage.getItem(REM);
  if (saved) { $('u').value = saved; $('remember').checked = true; $('p').focus(); }
} catch (e) {}

/* already signed in: go straight to the home page */
try { if (JSON.parse(sessionStorage.getItem('amm-auth'))) location.replace('home_page.html'); } catch (e) {}

/* why the user is back here (idle sign-out, expired session) */
(function () {
  let r = null;
  try { r = sessionStorage.getItem('pr-reason'); sessionStorage.removeItem('pr-reason'); } catch (e) {}
  const msg = { idle: 'You were signed out after a period of inactivity. Sign in to continue.', expired: 'Your session has ended. Sign in again to continue.' }[r];
  if (msg) { $('noticeTxt').textContent = msg; $('notice').hidden = false; }
})();

/* after sign-in, return to the page the user was trying to open (same-site .html pages only) */
function landingPage() {
  let n = null;
  try { n = sessionStorage.getItem('pr-next'); sessionStorage.removeItem('pr-next'); } catch (e) {}
  return n && /^[A-Za-z0-9_\-]+\.html(\?[A-Za-z0-9_=&%.\-]*)?$/.test(n) && !/^index\.html/.test(n) ? n : 'home_page.html';
}

const SUPABASE_URL = 'https://pycmkjrmdieaqsbgrher.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5Y21ranJtZGllYXFzYmdyaGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMjMxNzAsImV4cCI6MjEwNjU5OTE3MH0.9IE2c2FZ4BPv6Rvhfa_VniQ7LJvQ_c4EGDXFihYR4Lc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function setErr(msg) {
  const el = $('err');
  el.classList.add('hide');
  setTimeout(() => { el.textContent = msg; el.classList.remove('hide'); }, 150);
}
function resetBtn() {
  const b = $('go');
  b.disabled = false; b.classList.remove('loading', 'ok');
  b.querySelector('.lbl').textContent = 'Login';
}

$('f').onsubmit = async function (e) {
  e.preventDefault();
  const u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) { setErr(!u ? 'Enter your username.' : 'Enter your password.'); shake(); return; }

  if (coolLeft() > 0) { setErr('Too many attempts. Try again in ' + coolLeft() + 's.'); shake(); return; }

  const btn = $('go');
  $('err').textContent = '';
  btn.disabled = true; btn.classList.add('loading');
  try {
    const { data, error } = await sb.rpc('app_login', { p_username: u, p_password: p });
    if (error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    if (!row) throw new Error('bad');

    /* 'role' is an internal flag the existing sheet pages check; which cards a user sees is set by access */
    sessionStorage.setItem('amm-auth', JSON.stringify({
      user: row.username, name: row.full_name || row.username, role: 'admin', access: row.access || [], at: Date.now()
    }));
    try {
      if ($('remember').checked) localStorage.setItem(REM, u); else localStorage.removeItem(REM);
    } catch (e) {}

    sessionStorage.removeItem('pr-fails'); sessionStorage.removeItem('pr-lock');
    /* success: morph the button, fade the card out, then go to the home page */
    btn.classList.remove('loading'); btn.classList.add('ok');
    btn.querySelector('.lbl').textContent = 'Welcome';
    setTimeout(() => document.body.classList.add('leave'), 550);
    const dest = landingPage();
    setTimeout(() => location.replace(dest), 1000);
  } catch (ex) {
    resetBtn();
    if (ex.message === 'bad') {
      const n = (+sessionStorage.getItem('pr-fails') || 0) + 1;
      sessionStorage.setItem('pr-fails', n);
      if (n >= 5) {
        sessionStorage.setItem('pr-lock', Date.now() + 30000); sessionStorage.setItem('pr-fails', 0);
        setErr('Too many attempts. Try again in 30s.');
      } else setErr('Wrong username or password.' + (n >= 3 ? ' (' + (5 - n) + ' attempts left)' : ''));
    } else setErr('Could not reach the server. Try again.');
    shake();
  }
};

function coolLeft() { return Math.max(0, Math.ceil(((+sessionStorage.getItem('pr-lock') || 0) - Date.now()) / 1000)); }
function shake() {
  const w = $('wrap');
  w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  setTimeout(() => w.classList.remove('shake'), 500);
}
</script>
</body>
</html>
