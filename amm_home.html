<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMM Performance | Prithvi Realcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{
  --bg:#f5f8fc; --surface:#fff; --ink:#0f2142; --ink2:#51607a; --mute:#8794ab; --line:#e0e6f0;
  --head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);min-height:100vh;background:var(--bg);overflow-x:hidden;padding:clamp(1.25rem,4vw,2.5rem) 1.25rem 2.5rem;position:relative}
.mesh{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
.b1{width:48vmax;height:48vmax;background:#b9d0ff;left:-12vmax;top:-14vmax}
.b2{width:42vmax;height:42vmax;background:#bdf0de;right:-14vmax;top:8vh;animation-duration:27s;animation-delay:-6s}
.b3{width:46vmax;height:46vmax;background:#e4d6ff;left:18vw;bottom:-20vmax;animation-duration:31s;animation-delay:-12s}
.b4{width:30vmax;height:30vmax;background:#ffe3c7;right:14vw;bottom:-8vmax;animation-duration:24s;animation-delay:-3s;opacity:.45}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.08)}100%{transform:translate3d(-4vw,8vh,0) scale(.95)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

.top{width:100%;max-width:1040px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:.55rem;padding:.6rem 1.1rem .6rem .8rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:.9rem;text-decoration:none;transition:transform .25s var(--ease),color .2s,border-color .2s,box-shadow .25s;animation:rise .5s var(--ease) both}
.back:hover{transform:translateY(-2px);color:var(--ink);border-color:#cdd7e6;box-shadow:0 10px 20px -12px rgba(15,33,66,.4)}
.back:hover i{transform:translateX(-3px)}
.back i{transition:transform .3s var(--ease)}

.hero{width:100%;max-width:1040px;margin:clamp(1.5rem,5vw,2.75rem) auto 2.25rem}
.mark{width:52px;height:52px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1.2rem;box-shadow:0 14px 26px -14px rgba(15,33,66,.6);margin-bottom:1.25rem;animation:rise .6s var(--ease) both}
.head{font-family:var(--head);font-weight:700;letter-spacing:-.02em;line-height:1.15;font-size:clamp(1.9rem,4.6vw,2.8rem);min-height:1.2em}
.type::after{content:"";display:inline-block;width:3px;height:.85em;margin-left:5px;vertical-align:-.06em;background:var(--ink);animation:blink .9s steps(1) infinite}
.type.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.sub{margin-top:.6rem;color:var(--ink2);font-size:1.02rem;animation:rise .7s var(--ease) .2s both}

.grid{width:100%;max-width:1040px;margin:0 auto;display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{--c:#1d4ed8;--t:#e8efff;--mx:50%;--my:50%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;min-height:200px;padding:1.5rem;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(15,33,66,.04),0 14px 30px -20px rgba(15,33,66,.25);transition:transform .35s var(--ease),border-color .3s,box-shadow .35s;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*90ms + .3s);-webkit-tap-highlight-color:transparent}
.tile::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(260px circle at var(--mx) var(--my),var(--t),transparent 70%)}
.tile:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 26px 40px -20px rgba(15,33,66,.35)}
.tile:hover::before{opacity:1}
.tile:active{transform:translateY(-2px) scale(.99)}
.tile>*{position:relative}
.tile[hidden]{display:none}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.35rem;background:var(--t);color:var(--c);transition:background .3s,color .3s,transform .4s var(--ease)}
.tile:hover .ico{background:var(--c);color:#fff;transform:rotate(-6deg) scale(1.06)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.name{display:block;font-family:var(--head);font-weight:700;font-size:1.35rem;letter-spacing:-.02em}
.desc{display:block;font-size:.9rem;color:var(--ink2);margin-top:.25rem}
.go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:#f3f6fb;color:var(--mute);font-size:.85rem;transition:background .3s,color .3s,transform .35s var(--ease)}
.tile:hover .go{background:var(--c);color:#fff;transform:translateX(4px)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (hover:none){.tile:hover{transform:none}}
</style>
</head>
<body>
<div class="mesh"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>
<canvas id="fx"></canvas>

<div class="top">
  <a class="back" href="home_page.html"><i class="fas fa-arrow-left"></i>Back</a>
</div>

<header class="hero">
  <div class="mark"><i class="fas fa-chart-line"></i></div>
  <h1 class="head type" id="title"></h1>
  <p class="sub">Select a party to open its dashboard</p>
</header>

<nav class="grid" aria-label="Parties">
  <a class="tile" href="hzl_dashboard.html" data-access="amm:HZL" style="--i:0;--c:#0f8a6a;--t:#e3f5ef">
    <div class="ico"><i class="fas fa-industry"></i></div>
    <div class="foot"><div><span class="name">HZL</span><span class="desc">Party dashboard</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
  <a class="tile" href="pjpb/dashboard.html" data-access="amm:PJPB" style="--i:1;--c:#1d4ed8;--t:#e8efff">
    <div class="ico"><i class="fas fa-building"></i></div>
    <div class="foot"><div><span class="name">PJPB</span><span class="desc">Party dashboard</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
  <a class="tile" href="nbsk/dashboard.html" data-access="amm:NBSK" style="--i:2;--c:#7c3aed;--t:#efe9ff">
    <div class="ico"><i class="fas fa-warehouse"></i></div>
    <div class="foot"><div><span class="name">NBSK</span><span class="desc">Party dashboard</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
  <a class="tile" href="mvaa/dashboard.html" data-access="amm:MVAA" style="--i:3;--c:#b7791f;--t:#fdf3e1">
    <div class="ico"><i class="fas fa-gears"></i></div>
    <div class="foot"><div><span class="name">MVAA</span><span class="desc">Party dashboard</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
</nav>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function typeText(el, text, speed) {
  el.textContent = '';
  if (reduce) { el.textContent = text; el.classList.add('done'); return; }
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, i);
    if (i < text.length) { i++; setTimeout(step, speed || 70); }
    else el.classList.add('done');
  })();
}
(function () {
  const c = document.getElementById('fx'), ctx = c.getContext('2d');
  let W, H, P = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() {
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(70, Math.floor(W * H / 24000));
    P = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() * 1.6 + .6
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(29,78,216,.35)'; ctx.fill();
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) {
        ctx.strokeStyle = 'rgba(29,78,216,' + (.14 * (1 - d / 130)) + ')';
        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); frame();
  window.addEventListener('resize', () => { size(); if (reduce) frame(); });
})();

let S = null;
try { S = JSON.parse(sessionStorage.getItem('amm-auth')); } catch (e) {}
if (!S) location.replace('index.html');
else {
  const access = S.access || [];
  const can = k => access.includes('*') || access.includes(k) || access.includes(k.split(':')[0]);
  document.querySelectorAll('.tile').forEach(t => { if (!can(t.dataset.access)) t.hidden = true; });
  typeText(document.getElementById('title'), 'AMM Performance');
}

document.querySelectorAll('.tile').forEach(t => {
  t.addEventListener('pointermove', e => {
    const r = t.getBoundingClientRect();
    t.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    t.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});
</script>
</body>
</html>
