<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f4f7fc" />
<title>ODR Data | Prithvi Realcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{
  --bg:#f4f7fc; --surface:#fff;
  --ink:#0f2142; --ink2:#506078; --mute:#8794ab;
  --line:#e1e7f1; --gold:#b98a2c; --gold2:#d9ac4e;
  --head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{
  font-family:var(--body);color:var(--ink);min-height:100vh;
  background:linear-gradient(180deg,#f8faff 0%,var(--bg) 60%,#eef3fb 100%);
  overflow-x:hidden;position:relative;
  padding:1.1rem clamp(1rem,4vw,2.5rem) 2.5rem;
  -webkit-font-smoothing:antialiased;
}
a:focus-visible,button:focus-visible{outline:2px solid #1d4ed8;outline-offset:3px}

/* Atmosphere */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);animation:drift 26s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:#bcd2ff;opacity:.7;left:-14vmax;top:-20vmax}
.o2{width:34vmax;height:34vmax;background:#c3f1e1;opacity:.55;right:-10vmax;top:16vh;animation-duration:32s;animation-delay:-8s}
.o3{width:30vmax;height:30vmax;background:#fde7bd;opacity:.55;left:30vw;bottom:-18vmax;animation-duration:36s;animation-delay:-14s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5vw,6vh,0) scale(1.1)}}
.grain{
  position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.cursor-glow{
  position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(29,78,216,.09),transparent 65%);
  transform:translate3d(var(--gx,50vw),var(--gy,30vh),0);will-change:transform;
}

/* Top bar */
.top{
  width:100%;max-width:1120px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.55rem .6rem .55rem 1rem;
  background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 10px 30px -18px rgba(15,33,66,.35);
  position:sticky;top:.75rem;z-index:20;
}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--head);font-weight:600;letter-spacing:-.01em;font-size:1rem}
.mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.8rem;color:#fff;
  background:linear-gradient(140deg,#18357a,#1d4ed8);box-shadow:0 6px 14px -6px rgba(29,78,216,.7);
}
.top-right{display:flex;align-items:center;gap:.6rem}
.clock{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;padding:0 .4rem}
.back{
  display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);font:500 .88rem var(--body);
  transition:background .25s,border-color .25s,transform .35s var(--ease),box-shadow .3s;
}
.back:hover{border-color:#c9d4e6;transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(15,33,66,.45)}
@media (max-width:560px){.clock{display:none}.brand span{font-size:.92rem}}

/* Hero */
.hero{width:100%;max-width:1120px;margin:clamp(2.4rem,7vw,4.5rem) auto clamp(1.8rem,4vw,2.8rem)}
.head{
  font-family:var(--head);font-weight:800;letter-spacing:-.035em;line-height:1.04;
  font-size:clamp(2.4rem,7vw,5rem);min-height:1.05em;
  background:linear-gradient(180deg,#0f2142 30%,#2a4a8f 130%);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.type::after{
  content:"";display:inline-block;width:.06em;height:.8em;margin-left:.08em;vertical-align:-.04em;
  background:var(--gold2);animation:blink .9s steps(1) infinite;
}
.type.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.sub{margin-top:1rem;color:var(--ink2);font-size:clamp(1rem,1.6vw,1.15rem);max-width:46ch;line-height:1.5}

/* Inspiration */
.inspire{
  width:100%;max-width:1120px;margin:0 auto 1.25rem;
  display:flex;align-items:center;gap:1.25rem;padding:.9rem 1.5rem .9rem .9rem;
  border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#fff7e4,#fdf3dc 60%,#fff9ec);
  border:1px solid #ead8a8;
  box-shadow:0 18px 40px -26px rgba(150,110,30,.45),0 0 0 1px rgba(255,255,255,.7) inset;
}
.inspire::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);
  transform:translateX(-120%);animation:sheen 1.6s var(--ease) 1.4s 1 forwards;
}
@keyframes sheen{to{transform:translateX(120%)}}
.inspire-img{
  width:88px;height:88px;border-radius:18px;object-fit:cover;object-position:top center;flex:none;
  border:3px solid #fff;box-shadow:0 12px 26px -10px rgba(90,60,20,.45);
}
.inspire-title{font-family:var(--head);font-weight:600;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:-.02em;color:#5a4012}
.inspire-title em{font-style:normal;color:var(--gold);font-weight:800}

/* Bento */
.grid{
  width:100%;max-width:1120px;margin:0 auto;
  display:grid;gap:1rem;grid-template-columns:repeat(12,1fr);grid-auto-flow:dense;
}
.tile[href="amm_home.html"]{grid-column:span 7}
.tile[href="dispatch_dashboard.html"]{grid-column:span 5}
.tile[href="odr_home.html"],.tile[href="notices.html"],.tile[href="daily_rake_loading.html"]{grid-column:span 4}
@media (max-width:900px){.grid>.tile{grid-column:span 6!important}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.grid>.tile{grid-column:auto!important}}

.tile{
  --c:#1d4ed8;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;gap:2.5rem;
  min-height:230px;padding:1.5rem;border-radius:26px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);color:inherit;text-decoration:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 1px 2px rgba(15,33,66,.04),0 22px 40px -28px rgba(15,33,66,.35);
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s;
  -webkit-tap-highlight-color:transparent;
  animation:rise .9s var(--ease) both;animation-delay:calc(var(--i)*90ms + .55s);
}
.tile:first-child{min-height:260px}
.tile::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(360px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 14%,transparent),transparent 70%);
}
.tile:hover{border-color:color-mix(in srgb,var(--c) 60%,#fff);box-shadow:0 34px 56px -30px color-mix(in srgb,var(--c) 55%,transparent)}
.tile:hover::before{opacity:1}
.tile:active{transition-duration:.15s;transform:perspective(900px) scale(.985)}
.tile[hidden]{display:none}
.ghost{
  position:absolute;right:-14px;bottom:-22px;z-index:-1;font-size:9rem;line-height:1;color:var(--c);
  opacity:.06;transform:rotate(-10deg);transition:opacity .5s,transform .7s var(--ease);
}
.tile:hover .ghost{opacity:.12;transform:rotate(-4deg) scale(1.08) translate(-6px,-6px)}
.ico{
  width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.25rem;color:var(--c);
  background:color-mix(in srgb,var(--c) 11%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);
  transition:background .35s,color .35s,transform .6s var(--ease),box-shadow .4s;
}
.tile:hover .ico{background:var(--c);color:#fff;transform:rotate(-6deg) scale(1.06);box-shadow:0 12px 24px -10px var(--c)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.name{display:block;font-family:var(--head);font-weight:600;font-size:clamp(1.3rem,2.2vw,1.65rem);letter-spacing:-.025em}
.desc{display:block;font-size:.93rem;color:var(--ink2);margin-top:.3rem}
.go{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:.85rem;
  background:#f1f5fb;border:1px solid var(--line);color:var(--mute);
  transition:background .35s,color .35s,transform .5s var(--ease),border-color .35s;
}
.tile:hover .go{background:var(--c);border-color:var(--c);color:#fff;transform:translateX(5px) rotate(-45deg)}

/* Footer: navy anchor with gold accent */
.site-footer{
  width:100%;max-width:1120px;margin:3.5rem auto 0;padding:clamp(2rem,5vw,3.25rem) 1.75rem;
  position:relative;overflow:hidden;text-align:center;color:#e9efff;
  display:flex;flex-direction:column;align-items:center;gap:1.1rem;
  border-radius:30px;
  background:linear-gradient(135deg,#0f2142 0%,#18357a 60%,#1d4ed8 120%);
  box-shadow:0 30px 50px -28px rgba(15,33,66,.6);
  animation:rise .9s var(--ease) 1s both;
}
.site-footer::before,.site-footer::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.site-footer::before{width:300px;height:300px;right:-90px;top:-140px;background:radial-gradient(circle,rgba(217,172,78,.4),transparent 70%)}
.site-footer::after{width:260px;height:260px;left:-80px;bottom:-130px;background:radial-gradient(circle,rgba(189,240,222,.22),transparent 70%)}
.site-footer>*{position:relative}
.footer-quote{
  font-family:var(--head);font-weight:600;letter-spacing:-.025em;line-height:1.12;text-wrap:balance;
  font-size:clamp(1.6rem,4.6vw,3rem);max-width:18ch;color:#fff;
}
.footer-quote span{display:block;color:#f1cf86}
.footer-brand{font-family:var(--head);font-weight:600;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:#f1cf86}
.footer-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.chip{
  display:inline-flex;align-items:center;gap:.45rem;padding:.42rem .9rem;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:.84rem;color:#e9efff;
}
.chip i{color:#f1cf86;font-size:.78rem}

@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.top,.inspire,.hero{animation:rise .9s var(--ease) both}
.top{animation-delay:.05s}.hero{animation-delay:.2s}.inspire{animation-delay:.4s}

@media (hover:none){.tile{transform:none!important}}
@media (max-width:560px){
  .inspire{gap:1rem;padding:.8rem 1rem .8rem .8rem}
  .inspire-img{width:70px;height:70px}
  .tile{min-height:190px;gap:1.75rem}
  .ghost{font-size:7rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tile{transform:none!important}
}

/* Sub-page additions */
.back{text-decoration:none}
.back i{transition:transform .3s var(--ease)}
.back:hover i{transform:translateX(-3px)}
.hero{margin-top:clamp(2rem,5vw,3.5rem);margin-bottom:clamp(1.6rem,4vw,2.4rem)}
.hero-ico{
  width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.25rem;color:#fff;margin-bottom:1.25rem;
  background:linear-gradient(140deg,#18357a,#1d4ed8);box-shadow:0 14px 28px -12px rgba(29,78,216,.65);
}
.head{font-size:clamp(2.2rem,5.6vw,3.9rem)}
.grid .tile{min-height:210px;gap:2rem}
.grid .tile:first-child{min-height:210px}
.ico{
  width:76px;height:76px;padding:6px;overflow:hidden;background:#fff;border:1px solid var(--line);color:inherit;
}
.tile:hover .ico{background:#fff;color:inherit;transform:rotate(-4deg) scale(1.06);box-shadow:0 12px 22px -10px rgba(15,33,66,.4)}
.ico img{width:100%;height:100%;object-fit:contain;display:block}
.name{font-size:1.15rem}
.amm .tile:nth-child(-n+4){grid-column:span 3}
.amm .tile:nth-child(n+5){grid-column:span 4}
.odr .tile{grid-column:span 6}
</style>
</head>
<body>
<div class="aurora"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<canvas id="fx"></canvas>
<div class="grain"></div>
<div class="cursor-glow" id="glow"></div>

<header class="top">
  <div class="brand"><span class="mark"><i class="fas fa-layer-group"></i></span><span>Prithvi Realcon</span></div>
  <div class="top-right">
    <span class="clock" id="clock"></span>
    <a class="back" href="home_page.html"><i class="fas fa-arrow-left"></i>Back</a>
  </div>
</header>

<header class="hero">
  <div class="hero-ico"><i class="fas fa-database"></i></div>
  <h1 class="head type" id="title" aria-live="polite"></h1>
  <p class="sub">Select a portal to open its data</p>
</header>

<nav class="grid odr" aria-label="Portals">
  <a class="tile" href="hzl_odr.html" data-access="odr:HZL" style="--i:0;--c:#0f8a6a">
    <div class="ico"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f0/HZL_Logo.png" alt="Hindustan Zinc Limited logo" width="64" height="64" loading="lazy" /></div>
    <div class="foot"><div><span class="name">Hindustan Zinc</span><span class="desc">Railway operations ODR</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
  <a class="tile" href="nlod_odr.html" data-access="odr:NALCO" style="--i:1;--c:#1d4ed8">
    <div class="ico"><img src="https://upload.wikimedia.org/wikipedia/en/c/c6/National_Aluminium_Company_logo.svg" alt="National Aluminium Company Limited logo" width="64" height="64" loading="lazy" /></div>
    <div class="foot"><div><span class="name">National Aluminium Company Limited</span><span class="desc">Railway operations ODR</span></div><span class="go"><i class="fas fa-arrow-right"></i></span></div>
  </a>
</nav>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function typeText(el, text, speed) {
  el.textContent = '';
  if (reduce) { el.textContent = text; el.classList.add('done'); return; }
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, i);
    if (i < text.length) { i++; setTimeout(step, speed || 55); }
    else el.classList.add('done');
  })();
}
(function () {
  const c = document.getElementById('fx'), ctx = c.getContext('2d');
  let W, H, P = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() {
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(60, Math.floor(W * H / 26000));
    P = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, r: Math.random() * 1.4 + .5
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(29,78,216,.35)'; ctx.fill();
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 140) {
        ctx.strokeStyle = 'rgba(29,78,216,' + (.13 * (1 - d / 140)) + ')';
        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); frame();
  window.addEventListener('resize', () => { size(); if (reduce) frame(); });
})();

let S = null;
try { S = JSON.parse(sessionStorage.getItem('amm-auth')); } catch (e) {}
if (!S) location.replace('index.html');
else {
  const access = S.access || [];
  const can = k => access.includes('*') || access.includes(k) || access.includes(k.split(':')[0]);
  document.querySelectorAll('.tile').forEach(t => { if (!can(t.dataset.access)) t.hidden = true; });
  typeText(document.getElementById('title'), 'ODR Data');
}

(function () {
  const el = document.getElementById('clock');
  function tick() {
    const d = new Date();
    el.textContent = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) +
      '  ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }
  tick(); setInterval(tick, 30000);
})();

const fine = matchMedia('(hover:hover)').matches;
document.querySelectorAll('.tile').forEach(t => {
  t.addEventListener('pointermove', e => {
    const r = t.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    t.style.setProperty('--mx', x + 'px');
    t.style.setProperty('--my', y + 'px');
    if (fine && !reduce) {
      t.style.setProperty('--ry', ((x / r.width - .5) * 5) + 'deg');
      t.style.setProperty('--rx', ((.5 - y / r.height) * 5) + 'deg');
    }
  });
  t.addEventListener('pointerleave', () => {
    t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg');
  });
});
if (fine && !reduce) {
  const g = document.getElementById('glow');
  addEventListener('pointermove', e => {
    g.style.setProperty('--gx', e.clientX + 'px');
    g.style.setProperty('--gy', e.clientY + 'px');
  }, { passive: true });
}
</script>
</body>
</html>
