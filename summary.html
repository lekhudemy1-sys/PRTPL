<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="activity-tracker.js?v=4"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1224">
<title>AMM Party-wise Summary Report</title>
<link rel="icon" type="image/svg+xml" href="party_summary_favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#dfe7f2;
  --bg-2:#d3ddeb;
  --glass:rgba(248,250,254,.72);
  --surface:#f6f8fc;
  --surface-2:#e9eef7;
  --surface-3:#dde5f1;
  --border:#c6d2e3;
  --border-soft:#d8e1ee;
  --text:#0b1224;
  --text-2:#2b3a55;
  --muted:#5d6e8c;
  --navy:#0b1224;
  --navy-2:#13203a;
  --indigo:#4338ca;
  --cyan:#0891b2;
  --violet:#7c3aed;
  --amber:#f59e0b;
  --brand-ink:#92400e;
  --under:#ea580c;
  --over:#0891b2;
  --ench:#7c3aed;
  --ok:#059669;
  --warn:#e11d48;
  --radius:20px;
  --radius-sm:13px;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(11,18,36,.06),0 14px 34px -18px rgba(11,18,36,.28);
  --shadow-lg:0 1px 0 rgba(255,255,255,.7) inset,0 26px 50px -22px rgba(67,56,202,.42);
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 100%);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
/* animated aurora + grid backdrop */
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55}
body::before{width:560px;height:560px;left:-140px;top:-160px;background:radial-gradient(circle,#818cf8,transparent 65%);animation:drift1 22s var(--ease) infinite alternate}
body::after{width:620px;height:620px;right:-180px;bottom:-200px;background:radial-gradient(circle,#22d3ee,transparent 65%);animation:drift2 26s var(--ease) infinite alternate}
.grid-bg{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(67,56,202,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(67,56,202,.07) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%);
}
@keyframes drift1{to{transform:translate(160px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-140px,-110px) scale(.9)}}
.wrap{max-width:1380px;margin:0 auto;padding:22px 20px 40px;position:relative}

/* ---------- header (deep navy, animated) ---------- */
.board{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:22px 26px;margin-bottom:18px;border-radius:24px;color:#e6edf9;
  background:radial-gradient(900px 300px at 0% 0%,rgba(99,102,241,.45),transparent 60%),
             radial-gradient(700px 260px at 100% 100%,rgba(6,182,212,.35),transparent 60%),
             linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);
  box-shadow:0 24px 48px -24px rgba(11,18,36,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  animation:rise .7s var(--ease) both;
}
/* rotating light border */
.board::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;
  background:conic-gradient(from var(--ang),transparent 0 60%,#60a5fa 75%,#a78bfa 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spinAng 6s linear infinite;
}
/* scanning sweep */
.board::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);
  animation:sweep 5.5s ease-in-out infinite;
}
@keyframes spinAng{to{--ang:360deg}}
@keyframes sweep{0%{left:-50%}60%,100%{left:120%}}
.logo{
  position:relative;width:52px;height:52px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fde68a,#f59e0b);color:#1c1917;
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.6px;
  box-shadow:0 0 0 1px rgba(255,255,255,.2),0 10px 28px -8px rgba(245,158,11,.8);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-3px)}}
.title{min-width:0;flex:1 1 320px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:#a5b4d6;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:4px 11px;border-radius:999px;margin-bottom:10px;
}
.kicker i{position:relative;width:7px;height:7px;border-radius:50%;background:#34d399}
.kicker i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #34d399;animation:ping 1.8s var(--ease) infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.board h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.5px;color:#fff}
.board h1 .accent{
  background:linear-gradient(90deg,#93c5fd,#c4b5fd,#67e8f9,#93c5fd);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmerText 7s linear infinite;
}
@keyframes shimmerText{to{background-position:300% 0}}
.board .sub{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.board .sub span{
  font-size:12px;color:#c7d2ea;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
  padding:4px 11px;border-radius:999px;
}
.range{
  position:relative;z-index:1;min-width:260px;padding:14px 18px;border-radius:16px;color:#fff;
  background:linear-gradient(135deg,#312e81 0%,#4338ca 55%,#6d28d9 100%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 16px 32px -16px rgba(67,56,202,.9),inset 0 1px 0 rgba(255,255,255,.22);
}
.range::before{
  content:"REPORTING PERIOD";display:block;margin-bottom:7px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.4px;color:#c7d2fe;
}
.range span{display:block;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.2px;white-space:nowrap;color:#fff}
.range small{display:block;margin-top:5px;font-family:var(--mono);font-size:11.5px;color:#c7d2fe;white-space:nowrap}

.back-top{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;
  color:#e6edf9;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:10px 15px;font-weight:600;transition:background .25s,transform .25s var(--ease);
}
.back-top:hover{background:rgba(255,255,255,.14);transform:translateX(-3px)}
@media(max-width:760px){
  .board{padding:18px;gap:14px}
  .board h1{font-size:23px}
  .range{min-width:0;width:100%}
  .back-top{width:100%;justify-content:center}
}

/* ---------- toolbar (glass) ---------- */
.controls{
  position:sticky;top:12px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin:0 0 18px;padding:10px 12px;border-radius:18px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);
  animation:rise .7s .08s var(--ease) both;
}
.controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.controls input{
  background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;
  padding:8px 11px;font:inherit;font-size:13px;transition:border-color .2s,box-shadow .2s;
}
.controls input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(67,56,202,.15)}
.presets{position:relative;display:flex;gap:2px;padding:3px;background:var(--surface-3);border-radius:13px}
.preset{
  position:relative;z-index:1;background:transparent;border:0;color:var(--muted);border-radius:10px;
  padding:7px 13px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer;transition:color .25s;
}
.preset:hover{color:var(--text)}
.preset.on{color:#fff}
.preset.on::before{
  content:"";position:absolute;inset:0;border-radius:10px;z-index:-1;
  background:linear-gradient(135deg,var(--indigo),var(--violet));box-shadow:0 6px 16px -6px rgba(67,56,202,.7);
  animation:pop .35s var(--ease);
}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.preset:focus-visible,.btn:focus-visible,.chip:focus-visible,.legend button:focus-visible,.afilter select:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.btn{
  position:relative;overflow:hidden;background:var(--navy);color:#fff;border:0;border-radius:12px;
  padding:9px 15px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),box-shadow .2s;
  box-shadow:0 8px 18px -10px rgba(11,18,36,.8);
}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -12px rgba(11,18,36,.9)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--text-2);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{background:#fff}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
#status{color:var(--muted);font-size:12.5px;margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono)}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#status.ok::before{background:var(--ok);box-shadow:0 0 0 0 rgba(5,150,105,.6);animation:ping 2s infinite}
#status.err{color:var(--warn)}
#status.err::before{background:var(--warn)}
#status.load::before{background:var(--amber);animation:blink .9s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- breadcrumbs ---------- */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;min-height:30px}
.chip{
  background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:999px;padding:6px 14px;
  font-weight:600;font-size:12.5px;cursor:pointer;color:var(--text-2);transition:all .25s var(--ease);
}
.chip:hover{border-color:var(--indigo);color:var(--indigo);transform:translateY(-1px);box-shadow:var(--shadow)}
.chip.cur{cursor:default;background:var(--navy);border-color:var(--navy);color:#fff}
.chip.cur:hover{transform:none;box-shadow:none;color:#fff;border-color:var(--navy)}
.sep{color:var(--muted);font-size:14px}

/* ---------- area filter ---------- */
.afilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.afilter label{color:var(--muted);font-size:12px;font-weight:600}
.afilter select{
  background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;
  padding:8px 11px;font:inherit;font-size:13px;min-width:220px;cursor:pointer;
}
.afilter .hint{color:var(--muted);font-size:12px}

/* ---------- KPI cards (spotlight + tilt) ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{
  --mx:50%;--my:50%;
  position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(241,245,252,.9));
  border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);padding:17px 17px 16px;
  box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease);
  animation:rise .6s var(--ease) both;
}
.kpi:nth-child(1){animation-delay:.05s}.kpi:nth-child(2){animation-delay:.1s}.kpi:nth-child(3){animation-delay:.15s}
.kpi:nth-child(4){animation-delay:.2s}.kpi:nth-child(5){animation-delay:.25s}.kpi:nth-child(6){animation-delay:.3s}
.kpi::before{ /* cursor spotlight */
  content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .4s;
  background:radial-gradient(260px circle at var(--mx) var(--my),rgba(99,102,241,.2),transparent 70%);
}
.kpi:hover::before{opacity:1}
.kpi::after{ /* colored accent line */
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--c),transparent);
}
.kpi:hover{transform:translateY(-4px) perspective(800px) rotateX(2deg);box-shadow:var(--shadow-lg)}
.kpi .t{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.kpi .t i{
  color:#fff;background:linear-gradient(135deg,var(--c),var(--c));
  width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;
  box-shadow:0 6px 14px -6px var(--c);
}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;color:var(--text);margin-top:14px;font-variant-numeric:tabular-nums;letter-spacing:-.6px;font-family:var(--display)}
.kpi .s{color:var(--muted);font-size:12px;margin-top:3px;font-family:var(--mono)}

/* ---------- panels and tables ---------- */
.panel{
  position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(243,247,253,.9));
  border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);padding:20px;margin-bottom:18px;
  box-shadow:var(--shadow);overflow-x:auto;animation:rise .6s var(--ease) both;
}
.panel::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(99,102,241,.08),transparent 70%);
}
.panel:hover::before{opacity:1}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:11px;color:var(--text)}
.panel h3 i{
  color:#fff;background:linear-gradient(135deg,var(--indigo),var(--cyan));width:30px;height:30px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;box-shadow:0 8px 18px -8px rgba(67,56,202,.8);
}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0;max-width:740px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:720px}
th{
  background:rgba(226,233,244,.85);color:var(--muted);text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.7px;
  padding:11px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border);
}
th:first-child,td:first-child{text-align:left}
th:first-child{border-top-left-radius:12px}
th:last-child{border-top-right-radius:12px}
td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text-2);font-family:var(--mono);font-size:12.8px}
td.pn{font-family:'Inter',sans-serif;font-weight:700;color:var(--text);font-size:13.5px}
td.tot{color:var(--text);font-weight:600}
td.muted{color:var(--muted)}
td.pend{font-weight:600;color:var(--ok);font-family:'Inter',sans-serif}
td.pend.bad{color:var(--warn)}
tbody tr{transition:background .2s,transform .2s var(--ease)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover,tbody tr.click:focus-visible{background:linear-gradient(90deg,rgba(67,56,202,.08),rgba(8,145,178,.05));outline:none}
tbody tr.click:hover td:first-child{box-shadow:inset 3px 0 0 var(--indigo)}
tbody tr:nth-child(even):not(.grand){background:rgba(233,239,248,.35)}
tr.grand td{background:linear-gradient(90deg,#fef3c7,#fde68a);color:var(--text);font-weight:700;border:0}
tr.grand td:first-child{color:var(--brand-ink)}
/* table rows slide in */
tbody tr{animation:rowIn .45s var(--ease) both}
tbody tr:nth-child(2){animation-delay:.02s}tbody tr:nth-child(3){animation-delay:.04s}tbody tr:nth-child(4){animation-delay:.06s}
tbody tr:nth-child(5){animation-delay:.08s}tbody tr:nth-child(6){animation-delay:.1s}tbody tr:nth-child(7){animation-delay:.12s}
tbody tr:nth-child(n+8){animation-delay:.14s}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.note{
  background:linear-gradient(90deg,rgba(67,56,202,.1),rgba(8,145,178,.07));border:1px solid rgba(67,56,202,.2);
  border-radius:var(--radius-sm);padding:12px 15px;color:var(--text-2);font-size:13px;margin-bottom:16px;
}
.note i{color:var(--indigo);margin-right:7px}
.empty{text-align:center;padding:52px 18px;color:var(--muted)}
.empty i{font-size:34px;color:var(--indigo);margin-bottom:14px;display:block;animation:float 3s ease-in-out infinite}
.empty b{color:var(--text);font-size:16px;display:block;margin-bottom:5px;font-family:var(--display)}

/* ---------- loading ---------- */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,#ffffff 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:var(--radius);border:1px solid var(--border)}
.sk.kp{height:104px;margin-bottom:14px}
.sk.tb{height:280px}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.brow{display:flex;align-items:center;gap:12px;margin:12px 0;cursor:pointer;padding:8px 10px;border-radius:12px;transition:background .25s,transform .25s var(--ease)}
.brow:hover,.brow:focus-visible{background:rgba(67,56,202,.07);transform:translateX(3px);outline:none}
.brow .n{width:146px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--text)}
.brow .lbl{font-family:var(--mono);font-weight:600;font-size:12.5px;white-space:nowrap;min-width:116px;text-align:right;color:var(--text)}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-3);flex:1;min-width:120px;box-shadow:inset 0 1px 3px rgba(11,18,36,.12)}
.bar span{
  display:block;height:100%;transform-origin:left center;
  animation:growX 1.1s var(--ease) both;transition:filter .2s,width .5s var(--ease);
}
.bar span:hover{filter:brightness(1.12) saturate(1.3)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.legend{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin-top:16px;flex-wrap:wrap}
.legend button{
  background:rgba(255,255,255,.85);border:1px solid var(--border);color:var(--text-2);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .25s var(--ease);
}
.legend button:hover{border-color:var(--indigo);transform:translateY(-1px)}
.legend button.off{opacity:.4;text-decoration:line-through}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.donut{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut svg{flex:0 0 auto;overflow:visible;animation:spinIn 1.2s var(--ease) both}
@keyframes spinIn{from{opacity:0;transform:rotate(-140deg) scale(.7)}to{opacity:1;transform:none}}
.donut circle{cursor:pointer;transition:stroke-width .25s var(--ease),opacity .25s;filter:drop-shadow(0 4px 8px rgba(11,18,36,.15))}
.donut circle:hover{stroke-width:34}
.donut svg:hover circle:not(:hover){opacity:.35}
.dleg{flex:1;min-width:200px}

<script>
(function(){
'use strict';

/* ============ CONNECTIONS (same projects and anon keys as the AMM pages) ============ */
var SB='https://pycmkjrmdieaqsbgrher.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5Y21ranJtZGllYXFzYmdyaGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMjMxNzAsImV4cCI6MjEwNjU5OTE3MH0.9IE2c2FZ4BPv6Rvhfa_VniQ7LJvQ_c4EGDXFihYR4Lc';
var NSB='https://gcedsyxvfmlyujhftiyf.supabase.co';
var NKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjZWRzeXh2Zm1seXVqaGZ0aXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Mjg5ODMsImV4cCI6MjExMDIwNDk4M30.QsFXFMT1zS62UIfdbgtpXJHEicCVglvXHqgvik5Q5Rk';

var ORDER=['NALCO','GUJRAT POWER','JHABUA','BALCO','HZL'];
var EXTRA_PCT={HZL:5};
var COL={'NALCO':'#db2777','GUJRAT POWER':'#ea580c','JHABUA':'#0891b2','BALCO':'#4338ca','HZL':'#65a30d'};
var SERIES=[{k:'up',n:'Underload',c:'var(--under)'},{k:'op',n:'Overload',c:'var(--over)'},{k:'en',n:'ENCH',c:'var(--ench)'}];
var KPI_ICON={'Total penalty':'fa-indian-rupee-sign','Underload penalty':'fa-arrow-trend-down','Overload penalty':'fa-arrow-trend-up','ENCH penalty':'fa-bolt','Rakes loaded':'fa-train','Pending receive':'fa-hourglass-half','Pending recv':'fa-hourglass-half','Recv qty':'fa-box-open','Penalty / MT':'fa-scale-balanced','Rakes':'fa-train','Underload':'fa-arrow-trend-down','Overload':'fa-arrow-trend-up'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var PLANT_COLS=['party','plant','power_plant','plant_name','consignee','destination','dest','to_plant'];

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function hasN(v){return v!==null&&v!==undefined&&v!==''&&!isNaN(parseFloat(v))}
function r2(n){return Math.round(n*100)/100}
function uc(v){return String(v==null?'':v).trim().toUpperCase()}
function fN(n,d){return (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fRi(n){return '₹'+fN(Math.round(n),0)}
function pad(n){return n<10?'0'+n:''+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dfmt(s){var p=s.split('-');return p[2]+' '+MON[+p[1]-1]+' '+p[0]}
function daysIn(a,b){return Math.max(0,Math.round((Date.parse(b)-Date.parse(a))/864e5)+1)}
function pcol(p){return COL[p]||'#7c3aed'}

/* ============ DATA ============ */
function sel(base,key,table,query){
  var out=[],off=0;
  function page(){
    return fetch(base+'/rest/v1/'+table+'?'+query+'&limit=1000&offset='+off,{headers:{apikey:key,Authorization:'Bearer '+key}})
      .then(function(res){
        if(!res.ok)return res.text().then(function(t){throw new Error(table+': '+(t||res.status).slice(0,160))});
        return res.json();
      })
      .then(function(rows){
        out=out.concat(rows);
        if(rows.length<1000)return out;
        off+=1000;return page();
      });
  }
  return page();
}

/* rake-level party of a Gujarat record (same rule as the daily penalty page) */
function plantOf(r){
  if(r._p!=='GUJRAT POWER')return '';
  var i,v;
  for(i=0;i<PLANT_COLS.length;i++){
    v=r[PLANT_COLS[i]];
    if(v!==null&&v!==undefined&&String(v).trim()!==''&&!/GUJ/i.test(String(v)))return String(v).trim().toUpperCase();
  }
  var m=/\bTO\s+([A-Z0-9]+)\s*$/i.exec(String(r.siding||''));
  if(m)return m[1].toUpperCase();
  var ks=Object.keys(r);
  for(i=0;i<ks.length;i++){v=r[ks[i]];if(typeof v==='string'&&/^\s*(GETS|TPHS)\s*$/i.test(v))return v.trim().toUpperCase()}
  return '';
}

/* one rake record in the common shape used by the views */
function rakeOf(r,party){
  var rrw=num(r.rr_wt),chw=num(r.ch_wt),recvDone=num(r.recv_wt)>0;   /* same rule as the NALCO dashboard: received only when recv weight > 0 */
  return {rec:r,party:party,area:r.area?uc(r.area):'',siding:r.siding?uc(r.siding):'',
    rrw:rrw,chw:chw,recvDone:recvDone,recvQty:recvDone?num(r.recv_wt):0,
    pending:!recvDone,rrNo:String(r.rr_no==null?'':r.rr_no).trim()};
}

/* groups = one party, date, area and siding (the same rows as the daily penalty sheet),
   plus live groups for GUJRAT POWER, HZL and NALCO read from their dashboards.
   For NALCO the live penalty groups are used only on dates where the penalty sheet has no saved NALCO rows,
   so a date is never counted twice. NALCO receive status comes from one receive-only group per date
   that carries rakes received / pending but no RR qty (the RR qty comes from the penalty groups).
   JHABUA receive data comes from the PJPB MIS, with the same no-RR-qty rule.
   BALCO receive data comes from the BALCO MIS (mis_rake_log), with the same no-RR-qty rule. */
function buildGroups(sheet,gj,hz,nalcoRows,ovMap,jhRows,balRows){
  var groups=[];
  var nalcoSheetDates={},jhSheetDates={};
  sheet.forEach(function(r){
    if(uc(r.party)==='NALCO')nalcoSheetDates[r.sheet_date]=1;
    if(uc(r.party)==='JHABUA')jhSheetDates[r.sheet_date]=1;
    var rr=num(r.rr),ch=num(r.ch),fr=num(r.freight),uq=ch-rr;
    groups.push({src:'sheet',date:r.sheet_date,party:r.party,area:r.area,siding:r.siding,
      rakes:num(r.rakes),rr:rr,ch:ch,uQty:uq>0?uq:0,oQty:uq<0?-uq:0,
      up:uq<0?0:uq*fr,op:num(r.o1)+num(r.o2)+num(r.o3),en:num(r.ench),recs:[]});
  });

  /* JHABUA live rows (PJPB MIS, rows with an RR number) are used only on dates with no saved JHABUA sheet rows, same as NALCO */
  var jhLive=(jhRows||[]).filter(function(r){return !jhSheetDates[r.date]});
  var liveRows=gj.concat(hz).concat((nalcoRows||[]).filter(function(r){return !nalcoSheetDates[r.date]})).concat(jhLive);
  var lm={};
  liveRows.forEach(function(r){
    var area=uc(r.area||'-'),sid=uc(r.siding||'-'),pl=plantOf(r);
    if(pl&&!/\sTO\s/i.test(sid))sid=sid+' TO '+pl;
    var id='L|'+r.date+'|'+r._p+'|'+area+'|'+sid;
    var g=lm[id]||(lm[id]={id:id,src:'live',date:r.date,party:r._p,area:area,siding:sid,
      rakes:0,rr:0,ch:0,uQty:0,oQty:0,up:0,op:0,en:0,recs:[]});
    var x=rakeOf(r,r._p);x.area=area;x.siding=sid;
    g.rakes++;g.rr+=x.rrw;g.ch+=x.chw;
    if(hasN(r.rr_wt)&&hasN(r.ch_wt)){if(x.chw>x.rrw)g.uQty+=x.chw-x.rrw;else if(x.rrw>x.chw)g.oQty+=x.rrw-x.chw}
    g.up+=num(r.ul_ch);g.op+=num(r.pol_group)+num(r.ehbc_group);g.en+=num(r.enhc_charge);
    /* NALCO receive data is taken from its receive-only groups below, so its live groups hold no records */
    if(r._p!=='NALCO')g.recs.push(x);
  });
  Object.keys(lm).forEach(function(k){
    var g=lm[k];
    var xp=EXTRA_PCT[g.party]||0;
    if(xp){g.op=g.op*(xp/100);g.en=g.en*(xp/100)}   /* HZL: Overload and ENCH at 5% */
    ['rr','ch','uQty','oQty','up','op','en'].forEach(function(f){g[f]=r2(g[f])});
    var o=ovMap[g.id];
    if(o){   /* a hand-edited live row keeps the values typed in the daily penalty sheet */
      var kOp=g.op,kEn=g.en;
      g.rakes=Math.max(1,+o.rakes||1);g.rr=num(o.rr);g.ch=num(o.ch);
      g.uQty=num(o.u_qty);g.oQty=num(o.o_qty);
      g.up=hasN(o.freight)?r2(g.uQty*num(o.freight)):num(o.u_pen);
      g.op=num(o.o_pen);g.en=num(o.ench);g.edited=true;
      if(xp){g.op=kOp;g.en=kEn}   /* HZL: Overload and ENCH stay at the live 5% */
    }
    groups.push(g);
  });

  /* NALCO receive data: one group per date, received / pending rakes only, RR qty = 0 (counted in the penalty groups) */
  var nm={};
  (nalcoRows||[]).forEach(function(r){
    var g=nm[r.date]||(nm[r.date]={id:'N|'+r.date,src:'recv',date:r.date,party:'NALCO',area:'',siding:'',
      rakes:0,rr:0,ch:0,uQty:0,oQty:0,up:0,op:0,en:0,recs:[]});
    g.recs.push(rakeOf(r,'NALCO'));
    nm[r.date]=g;
  });
  Object.keys(nm).forEach(function(d){groups.push(nm[d])});

  /* JHABUA receive data only, from the PJPB MIS: one group per loading date, no penalty amounts.
     Rakes, RR qty, chargeable and penalties all stay from the daily penalty sheet, so every
     number except received / pending is 0 here and the penalty totals do not change. */
  var jm={};
  (jhRows||[]).forEach(function(r){
    if(!jhSheetDates[r.date])return;   /* dates with a live JHABUA group above already carry these rakes */
    var g=jm[r.date]||(jm[r.date]={id:'J|'+r.date,src:'recv',recvOnly:true,date:r.date,party:'JHABUA',area:'',siding:'',
      rakes:0,rr:0,ch:0,uQty:0,oQty:0,up:0,op:0,en:0,recs:[]});
    g.recs.push(rakeOf(r,'JHABUA'));
  });
  Object.keys(jm).forEach(function(d){groups.push(jm[d])});

  /* BALCO receive data only, from the BALCO MIS (mis_rake_log): one group per rake date, no penalty amounts.
     Same rule as JHABUA: rakes, RR qty, chargeable and penalties stay from the daily penalty sheet. */
  var bm={};
  (balRows||[]).forEach(function(r){
    var g=bm[r.date]||(bm[r.date]={id:'B|'+r.date,src:'recv',recvOnly:true,date:r.date,party:'BALCO',area:'',siding:'',
      rakes:0,rr:0,ch:0,uQty:0,oQty:0,up:0,op:0,en:0,recs:[]});
    g.recs.push(rakeOf(r,'BALCO'));
  });
  Object.keys(bm).forEach(function(d){groups.push(bm[d])});

  return groups;
}

/* penalty totals plus receive totals over a list of groups */
function agg(list){
  var a={rakes:0,rr:0,ch:0,uQty:0,oQty:0,up:0,op:0,en:0,n:0,recvN:0,recvQty:0,pendN:0,pendQty:0,live:false,recvHas:false};
  list.forEach(function(g){
    a.rakes+=g.rakes;a.rr+=g.rr;a.ch+=g.ch;a.uQty+=g.uQty;a.oQty+=g.oQty;
    a.up+=g.up;a.op+=g.op;a.en+=g.en;
    if(g.src==='live'||g.src==='recv'){
      if(!g.recvOnly)a.live=true;
      g.recs.forEach(function(x){
        a.n++;a.recvHas=true;
        if(x.recvDone){a.recvN++;a.recvQty+=x.recvQty}
        else{a.pendN++;a.pendQty+=x.rrw}
      });
    }
  });
  a.total=a.up+a.op+a.en;
  a.pm=a.rr>0?a.total/a.rr:null;
  a.recvQty=r2(a.recvQty);a.pendQty=r2(a.pendQty);
  return a;
}

function partyList(groups){
  var set={};groups.forEach(function(g){set[g.party]=1});
  return Object.keys(set).sort(function(a,b){
    var ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);
    if(ia<0)ia=99;if(ib<0)ib=99;
    return ia!==ib?ia-ib:(a<b?-1:1);
  });
}

/* ============ STATE ============ */
var S={from:'',to:'',groups:[],warn:[],view:{l:'home'},hide:{up:false,op:false,en:false},loadId:0,area:''};

function load(){
  var from=$('#from').value,to=$('#to').value;
  if(!from||!to||from>to){setStatus('Pick a valid date range','err');return}
  S.from=from;S.to=to;S.area='';
  var myId=++S.loadId;
  setStatus('Loading…','load');
  $('#main').innerHTML='<div class="sk kp"></div><div class="sk kp"></div><div class="sk kp"></div><div class="sk kp"></div><div class="sk tb"></div>';
  var warn=[];
  var q=function(col){return 'select=*&'+col+'=gte.'+from+'&'+col+'=lte.'+to};
  var fail=function(label){return function(e){warn.push(label+': '+e.message);return []}};
  Promise.all([
    sel(SB,KEY,'amm_penalty_entries',q('sheet_date')+'&order=sheet_date.asc,sort_order.asc').catch(fail('Penalty sheet')),
    sel(SB,KEY,'gujarat_rake_records',q('date')+'&order=date.asc').then(function(r){return r.map(function(x){x._p='GUJRAT POWER';return x})}).catch(fail('Gujarat dashboard')),
    sel(SB,KEY,'hzl_rake_records',q('date')+'&order=date.asc').then(function(r){return r.map(function(x){x._p='HZL';return x})}).catch(fail('HZL dashboard')),
    sel(NSB,NKEY,'nalco_rake_records',q('date')+'&order=date.asc').then(function(r){return r.map(function(x){x._p='NALCO';return x})}).catch(fail('NALCO dashboard')),
    sel(SB,KEY,'amm_penalty_live_overrides',q('sheet_date')).catch(function(){return []}),
    /* JHABUA (PJPB MIS, same rule as the daily penalty sheet): rows with an RR number, area and siding from the source,
       the Final Charges column is the overload penalty, and no underload / ENCH charge */
    sel(SB,KEY,'pjpb_mis_rows',q('loading_date')+'&order=loading_date.asc').then(function(r){
      return r.filter(function(x){return x.rr_number!==null&&x.rr_number!==undefined&&String(x.rr_number).trim()!==''})
        .map(function(x){return {_p:'JHABUA',date:x.loading_date,area:x.area,siding:x.source,box_type:x.box_type,
          rr_wt:x.rr_weight,ch_wt:x.chargeable_wt,pol_group:x.final_charges,recv_wt:x.recv_qty,rr_no:x.rr_number}});
    }).catch(fail('PJPB MIS')),
    /* BALCO receive data only (BALCO MIS, mis_rake_log). Only loaded rakes, i.e. rows with an RR number */
    sel(NSB,NKEY,'mis_rake_log',q('rake_date')+'&order=rake_date.asc').then(function(r){
      return r.filter(function(x){return String(x.rr_number==null?'':x.rr_number).trim()!==''})
        .map(function(x){return {date:x.rake_date,rr_wt:x.rr_weight,recv_wt:x.received_wt,rr_no:x.rr_number}});
    }).catch(fail('BALCO MIS'))
  ]).then(function(res){
    if(myId!==S.loadId)return;   /* a newer request has replaced this one */
    var ovMap={};res[4].forEach(function(o){ovMap[o.id]=o});
    S.groups=buildGroups(res[0],res[1],res[2],res[3],ovMap,res[5],res[6]);
    S.warn=warn;
    setStatus(warn.length?'Loaded with warnings':'Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),warn.length?'err':'ok');
    render();
  });
}
function setStatus(msg,cls){var el=$('#status');el.textContent=msg;el.className=cls||''}

/* ============ RENDER ============ */
function kpi(t,v,s,c){
  var ic=KPI_ICON[t]||'fa-circle';
  return '<div class="kpi" style="--c:'+c+'"><div class="t"><i class="fas '+ic+'"></i>'+t+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';
}
function pendCell(a){
  if(!a.n)return '<td class="muted">No data</td>';
  return '<td class="pend'+(a.pendN?' bad':'')+'">'+a.pendN+'/'+a.n+'</td>';
}
function recvCell(a){return a.recvHas?'<td>'+fN(a.recvQty,1)+'</td>':'<td class="muted">No data</td>'}
function empty(icon,title,text){
  return '<div class="panel empty"><i class="fas '+icon+'"></i><b>'+title+'</b>'+text+'</div>';
}

function render(){
  var G=agg(S.groups),days=daysIn(S.from,S.to),parties=partyList(S.groups);
  $('#rangeLbl').textContent=S.from?dfmt(S.from)+' – '+dfmt(S.to):'—';
  $('#rangeSub').textContent=days+' days · '+G.rakes+' rakes';
  $('#foot').textContent='Source: AMM Daily Penalty Check Sheets ('+(S.from?dfmt(S.from)+' – '+dfmt(S.to):'—')+') · Prepared for Prithvi Realcon';
  renderCrumbs();
  var v=S.view;
  if(v.l==='party')renderParty(v.p);
  else if(v.l==='date')renderDate(v.p,v.d);
  else renderHome(G,parties,days);
  makeFocusable();
  decodeNumbers();
}

function makeFocusable(){
  document.querySelectorAll('[data-go],[data-toggle]').forEach(function(el){el.setAttribute('tabindex','0')});
}

/* KPI values "decode" into place: digits scramble and settle left to right (display only, the text is unchanged at the end) */
function decodeNumbers(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.kpi .v').forEach(function(el){
    var target=el.textContent,t0=performance.now(),dur=900,chars='0123456789';
    cancelAnimationFrame(el._raf);
    (function step(now){
      var p=Math.min(1,(now-t0)/dur),out='',settle=Math.floor(p*target.length*1.4);
      for(var i=0;i<target.length;i++){
        var ch=target.charAt(i);
        out+= (i<settle||!/[0-9]/.test(ch))?ch:chars.charAt(Math.floor(Math.random()*10));
      }
      el.textContent=p>=1?target:out;
      if(p<1)el._raf=requestAnimationFrame(step);
    })(t0);
  });
}

function renderCrumbs(){
  var v=S.view,h='<span class="chip" data-go="home">All parties</span>';
  if(v.p){
    h+='<span class="sep">›</span>';
    h+=v.l==='party'?'<span class="chip cur">'+esc(v.p)+'</span>':'<span class="chip" data-go="party" data-p="'+esc(v.p)+'" style="color:'+pcol(v.p)+'">'+esc(v.p)+'</span>';
  }
  if(v.l==='date')h+='<span class="sep">›</span><span class="chip cur">'+dfmt(v.d)+'</span>';
  $('#crumbs').innerHTML=h;
}

function renderHome(G,parties,days){
  if(!S.groups.length){
    var msg=S.warn.length?esc(S.warn.join(' | ')):'Try a different date range, or check that the daily penalty sheet has entries for these days.';
    $('#main').innerHTML=empty('fa-folder-open','No rakes or penalty entries found',msg);
    return;
  }
  var rows=parties.map(function(p){return {p:p,a:agg(S.groups.filter(function(g){return g.party===p}))}});
  var pendTot=G.pendN,nTot=G.n;

  var max=Math.max.apply(null,[0].concat(rows.map(function(r){return vis(r.a)})));

function bindCharts(rows,G){
  var base=G.total;
  document.querySelectorAll('[data-seg]').forEach(function(c){
    c.addEventListener('mouseenter',function(){
      var p=c.getAttribute('data-seg'),r=rows.filter(function(x){return x.p===p})[0];
      if(!r)return;
      $('#dName').textContent=fRi(r.a.total);
      $('#dName').setAttribute('fill',pcol(p));
      $('#dSub').textContent=(base>0?(r.a.total/base*100).toFixed(1):'0.0')+'% · '+p;

    c.addEventListener('mouseleave',function(){
      $('#dName').textContent=fRi(G.total);$('#dName').setAttribute('fill','#0b1224');$('#dSub').textContent='TOTAL';
    });
  });
}

/* ============ EXPORT ============ */
/* saves the whole report (header, tables and charts; no toolbar) as a PNG image */
function exportPng(){
  var target=document.querySelector('.wrap');
  if(!target||typeof html2canvas!=='function'){setStatus('PNG export needs html2canvas, which did not load (check the internet connection)','err');return}
  var btn=$('#png');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Exporting…';
  var sticky=document.querySelector('.controls');
  var prev=sticky?sticky.style.position:'';
  if(sticky)sticky.style.position='static';   /* a sticky bar would otherwise be drawn in the middle of the image */
  var w=Math.ceil(target.scrollWidth),h=Math.ceil(target.scrollHeight);
  /* keep the canvas inside browser limits: at most 16,000 px per side and about 16 million pixels in total */
  var scale=Math.max(1,Math.min(2,16000/h,Math.sqrt(16000000/(w*h))));

  function cloneFix(doc){
    /* html2canvas cannot draw blur, masks, animations or colour-mix() effects, so the exported copy uses plain styles */
    var st=doc.createElement('style');
    st.textContent='*,*::before,*::after{animation:none!important;transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;filter:none!important;mask-image:none!important;-webkit-mask-image:none!important}'+
      '.kpi::before,.kpi::after,.panel::before,.board::before,.board::after,body::before,body::after,.grid-bg{display:none!important}';
    doc.head.appendChild(st);
    /* gradient text is not drawn by html2canvas, so use a solid colour in the exported copy */
    var ac=doc.querySelector('.board h1 .accent');
    if(ac){ac.style.background='none';ac.style.webkitTextFillColor='#93c5fd';ac.style.color='#93c5fd'}
    /* KPI icon chips: use the card colour directly */
    doc.querySelectorAll('.kpi').forEach(function(k){
      var c=k.style.getPropertyValue('--c');
      var i=k.querySelector('.t i');
      if(i){i.style.background=c;i.style.color='#fff';i.style.boxShadow='none'}
    });
    /* PNG only: drop the explanatory hint lines under the panel titles */
    doc.querySelectorAll('.panel-head .hint').forEach(function(el){el.style.display='none'});
    /* PNG only: the date range sits on the header colour, with no separate box */
    doc.querySelectorAll('.range').forEach(function(r){r.style.background='none';r.style.border='0';r.style.boxShadow='none'});
    /* keep the header, but no filter bar (dates, Refresh, Export PNG, status), no Back button and no breadcrumb chips */
    doc.querySelectorAll('.controls,.back-top,.crumbs').forEach(function(el){el.style.display='none'});
  }
  function capture(o){
    return html2canvas(target,Object.assign({
      backgroundColor:'#dfe7f2',logging:false,width:w,height:h,windowWidth:w,windowHeight:h,onclone:cloneFix
    },o)).then(function(canvas){
      if(!canvas||!canvas.width)throw new Error('the page came out empty');
      return canvas;
    });
  }

  /* attempt 1: full quality. attempt 2: plain copy at 1x without cross-origin loading, in case attempt 1 failed */
  capture({scale:scale,useCORS:true})
    .catch(function(e1){
      console.warn('PNG: first attempt failed, retrying simply',e1);
      return capture({scale:1,useCORS:false});
    })
    .then(function(canvas){ savePng(canvas); })
    .catch(function(err){
      console.error('PNG export failed',err);
      setStatus('Could not create the PNG'+(err&&err.message?' ('+err.message+')':'')+' – try Print (Ctrl+P) and save as PDF','err');
    })
    .then(function(){
      if(sticky)sticky.style.position=prev;
      btn.disabled=false;btn.innerHTML='<i class="fas fa-image"></i> Export PNG';
    });
}

/* hands the image to the browser as a download; if the browser blocks downloads, it opens the image in a new tab */
function savePng(canvas){
  var url;
  try{url=canvas.toDataURL('image/png')}
  catch(e){throw new Error('the browser would not export the image: '+e.message)}
  var name='party_summary_'+S.from+'_to_'+S.to+'.png';
  var a=document.createElement('a');
  a.href=url;a.download=name;a.rel='noopener';
  document.body.appendChild(a);
  if('download' in a){a.click();setStatus('PNG saved as '+name,'ok')}
  else{window.open(url,'_blank');setStatus('PNG opened in a new tab – save it from there','ok')}
  setTimeout(function(){a.remove()},300);
}

/* ============ EVENTS ============ */
function go(t,el){
  S.area='';
  if(t==='home')S.view={l:'home'};
  else if(t==='party')S.view={l:'party',p:el.getAttribute('data-p')};
  else if(t==='date')S.view={l:'date',p:el.getAttribute('data-p'),d:el.getAttribute('data-d')};
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
document.addEventListener('click',function(e){
  var tog=e.target.closest('[data-toggle]');
  if(tog){
    var k=tog.getAttribute('data-toggle');
    S.hide[k]=!S.hide[k];
    render();
    return;
  }
  var el=e.target.closest('[data-go]');
  if(!el)return;
  go(el.getAttribute('data-go'),el);
});
/* area filter on the party view */
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='areaSel'){
    S.area=e.target.value;
    render();
  }
});
/* keyboard: Enter or Space opens a row, Escape goes back to all parties */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.view.l!=='home'){S.view={l:'home'};S.area='';render();return}
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=e.target.closest&&e.target.closest('[data-go],[data-toggle]');
  if(!el)return;
  e.preventDefault();
  el.click();
});

/* cursor spotlight for KPI cards and panels (presentation only) */
document.addEventListener('mousemove',function(e){
  var card=e.target.closest&&e.target.closest('.kpi,.panel');
  if(!card)return;
  var r=card.getBoundingClientRect();
  card.style.setProperty('--mx',(e.clientX-r.left)+'px');
  card.style.setProperty('--my',(e.clientY-r.top)+'px');
});

/* tooltip for the bar segments */
document.addEventListener('mouseover',function(e){
  var el=e.target.closest('[data-tip]');
  var tip=$('#tip');
  if(!el){tip.classList.remove('on');return}
  var parts=el.getAttribute('data-tip').split('|'),p=parts[0],k=parts[1];
  var a=agg(S.groups.filter(function(g){return g.party===p}));
  var s=SERIES.filter(function(x){return x.k===k})[0];
  var val=a[k],t=a.total;
  tip.innerHTML='<b style="color:'+pcol(p)+'">'+esc(p)+'</b>'+
    '<div>'+s.n+': <b style="display:inline;margin:0;color:#fff">'+fRi(val)+'</b></div>'+
    '<div>Share of party: '+(t>0?(val/t*100).toFixed(1):'0.0')+'%</div>'+
    '<div>Party total: '+fRi(t)+'</div>';
  tip.classList.add('on');
});
document.addEventListener('mousemove',function(e){
  var tip=$('#tip');
  if(!tip.classList.contains('on'))return;
  var x=e.clientX+16,y=e.clientY+16;
  if(x+tip.offsetWidth>window.innerWidth-8)x=e.clientX-tip.offsetWidth-16;
  if(y+tip.offsetHeight>window.innerHeight-8)y=e.clientY-tip.offsetHeight-16;
  tip.style.left=x+'px';tip.style.top=y+'px';
});

function setRange(from,to){
  $('#from').value=from;$('#to').value=to;
  S.view={l:'home'};load();
}
function init(){
  var now=new Date();
  var yday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  var weekAgo=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6);
  $('#from').value=isoOf(new Date(now.getFullYear(),now.getMonth(),1));
  $('#to').value=isoOf(now);
  document.querySelectorAll('[data-preset]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('[data-preset]').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      var k=b.getAttribute('data-preset');
      if(k==='mtd')setRange(isoOf(new Date(now.getFullYear(),now.getMonth(),1)),isoOf(now));
      if(k==='7d')setRange(isoOf(weekAgo),isoOf(now));
      if(k==='yday')setRange(isoOf(yday),isoOf(yday));
    });
  });
  document.querySelector('[data-preset="mtd"]').classList.add('on');
  $('#reload').addEventListener('click',function(){S.view={l:'home'};load()});
  $('#png').addEventListener('click',exportPng);
  $('#from').addEventListener('change',function(){S.view={l:'home'};load()});
  $('#to').addEventListener('change',function(){S.view={l:'home'};load()});
  load();
}
init();
})();
</script>
</body>
</html>
